name: JFS AI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfs-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    name: Static HTML/JS checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s inventory.html
          test -s subscription.html

      - name: Check HTML structure
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for name in ("index.html", "inventory.html", "subscription.html"):
              data = Path(name).read_text(encoding="utf-8")
              p = Parser()
              p.feed(data)
              p.close()
              if "<!doctype html>" not in data.lower():
                  raise SystemExit(f"Missing doctype: {name}")
              print(f"OK: {name}")

      - name: Check JavaScript syntax in inline scripts
        shell: python
        run: |
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          for name in ("index.html", "inventory.html", "subscription.html"):
              text = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, re.I | re.S)
              for i, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                      f.write(script)
                      temp = f.name
                  result = subprocess.run(["node", "--check", temp], text=True, capture_output=True)
                  Path(temp).unlink(missing_ok=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f"JavaScript syntax error in {name}, inline script #{i}")
              print(f"OK JS: {name}")

  smoke-test:
    name: Local smoke test
    runs-on: ubuntu-latest
    needs: static-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jfs-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null && curl -fsS http://127.0.0.1:4173/inventory.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jfs-http.log
          exit 1

      - name: Verify critical pages are served
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4173/index.html | grep -q "JFS AI"
          curl -fsS http://127.0.0.1:4173/inventory.html | grep -q "Stok Barang"
