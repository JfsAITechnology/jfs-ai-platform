name: Core Security Test

on:
  push:
    branches: ["fix/core-tenant-isolation-2026-09"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: python3 scripts/validate-js.py
      - name: Verify security hardening contains tenant bootstrap revoke
        run: grep -q "revoke execute on function public.ensure_tenant_for_user(uuid)" security-hardening.sql
      - name: Verify tenant isolation harness exists
        run: test -s tenant-isolation-test.sql
