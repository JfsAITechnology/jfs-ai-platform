name: Customer Portal E2E
on:
  push:
    paths:
      - 'customer.html'
      - 'tests/customer-portal.spec.mjs'
      - '.github/workflows/customer-portal-e2e.yml'
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y
      - run: npm install -D @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Serve the checked-out customer portal
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/customer-portal-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/customer.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/customer-portal-http.log
          exit 1
      - run: npx playwright test tests/customer-portal.spec.mjs
