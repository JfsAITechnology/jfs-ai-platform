name: Fix Rekap Logo Path
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-rekap-logo-path.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace logo paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('laporan-rekap-muatan/index.html')
          s = p.read_text(encoding='utf-8')
          old = '../mas-firman-pratama/assets/brand/jfs-ai-logo.jpg'
          new = 'https://raw.githubusercontent.com/JfsAITechnology/jfs-ai-platform/main/mas-firman-pratama/assets/brand/jfs-ai-logo.jpg'
          if old not in s:
              raise SystemExit('Logo path not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laporan-rekap-muatan/index.html
          git rm .github/workflows/fix-rekap-logo-path.yml
          git commit -m 'Fix JFS AI logo path for GitHub Pages deployment'
          git push
