name: Install Mas Firman JFS AI logo
on:
  push:
permissions:
  contents: write
jobs:
  install:
    if: github.event.head_commit.message != 'Install Mas Firman JFS AI logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write uploaded logo and update demo
        env:
          LOGO_B64: 
      - name: Install
        run: |
          echo "$LOGO_B64" | base64 -d > mas-firman-pratama/logo.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mas-firman-pratama/demo.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="logo.jpg"','src="logo.png"',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'JFS AI Technology'
          git config user.email '316434542+JfsAITechnology@users.noreply.github.com'
          git add mas-firman-pratama/logo.png mas-firman-pratama/demo.html
          git commit -m 'Install Mas Firman JFS AI logo'
          git push
