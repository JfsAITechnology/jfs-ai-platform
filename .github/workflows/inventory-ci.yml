name: Inventory CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/inventory-stock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          test -s index.html
          test -s inventory.html
          test -s core-services.js
          test -s subscription.html
      - name: HTML checks
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          for name in ('index.html','inventory.html','subscription.html'):
              data=Path(name).read_text(encoding='utf-8')
              p=HTMLParser(); p.feed(data); p.close()
              assert '<!doctype html>' in data.lower(), f'Missing doctype: {name}'
              print('OK:', name)
      - name: JavaScript syntax checks
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          for name in ('core-services.js','index.html','inventory.html','subscription.html'):
              text=Path(name).read_text(encoding='utf-8')
              scripts=[text] if name.endswith('.js') else re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.I|re.S)
              for i,script in enumerate(scripts,1):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                      f.write(script); temp=f.name
                  r=subprocess.run(['node','--check',temp],text=True,capture_output=True)
                  Path(temp).unlink(missing_ok=True)
                  if r.returncode:
                      print(r.stderr); raise SystemExit(f'JavaScript syntax error: {name} #{i}')
              print('OK JS:',name)
      - name: Secret pattern check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(sk-[A-Za-z0-9]{20,}|service_role|SUPABASE_SERVICE_ROLE_KEY)' --exclude-dir=.git --exclude-dir=.github --exclude='*.md' .; then
            echo 'Potential secret-like value detected.'; exit 1
          fi

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium
      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/jfs-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null && curl -fsS http://127.0.0.1:4173/inventory.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          curl -fsS http://127.0.0.1:4173/inventory.html >/dev/null
          NODE_PATH="$(npm root -g)" node <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:10000});
            if(!(await page.title()).includes('JFS AI')) throw new Error('Index title check failed');
            await page.goto('http://127.0.0.1:4173/inventory.html',{waitUntil:'domcontentloaded',timeout:10000});
            if(!(await page.title()).includes('JFS AI')) throw new Error('Inventory title check failed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF