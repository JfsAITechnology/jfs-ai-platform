name: Deploy JFS AI Rekap Muatan to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'laporan-rekap-muatan/**'
      - '.github/workflows/pages-rekap-muatan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rekap-muatan
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./laporan-rekap-muatan

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
