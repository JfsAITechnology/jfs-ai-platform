name: Deploy JFS AI Rekap Muatan to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'laporan-rekap-muatan/**'
      - '.github/workflows/pages-rekap-muatan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rekap-muatan
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp -R laporan-rekap-muatan/. _site/
          cp laporan-rekap-muatan/assets/jfs-ai-robot.png _site/assets/jfs-ai-robot.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
