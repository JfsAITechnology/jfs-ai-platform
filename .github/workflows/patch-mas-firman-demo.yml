name: Patch Mas Firman demo
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[demo-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content layer
        env:
          PAYLOAD: 
        run: |
          echo "$PAYLOAD" | base64 -d | gzip -d > /tmp/patch_demo.py
          python3 /tmp/patch_demo.py
      - name: Commit
        run: |
          git config user.name 'JFS AI Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mas-firman-pratama/demo.html
          git diff --cached --quiet || (git commit -m 'Restore book details and admin knowledge schedules [demo-patched]' && git push)