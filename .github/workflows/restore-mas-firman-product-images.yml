name: Restore Mas Firman Product Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore catalog and AMC images
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('mas-firman-pratama/demo.html')
          s = path.read_text(encoding='utf-8')

          start = s.find('const products=[')
          end = s.find('function renderProducts(){', start)
          if start < 0 or end < 0:
              raise SystemExit('Products renderer target not found')

          replacement = r'''const products=[
            {id:'book1',name:'Buku 10 Keajaiban Pikiran',price:'Rp250.000',desc:'Langkah awal mengenali keajaiban pikiran.',img:'https://masfirmanpratama.com/wp-content/uploads/2024/11/10kc.jpg'},
            {id:'book2',name:'Kitab 101 Kalimat Sugesti Ajaib',price:'Rp250.000',desc:'Panduan 101 kalimat sugesti dan materi pendukung.',img:'https://masfirmanpratama.com/wp-content/uploads/2024/11/101-tanpa-web-2.jpg'},
            {id:'book3',name:'Buku Alpha Telepati',price:'Rp250.000',desc:'Buku pendamping Alpha Telepati dan komunikasi pikiran.',img:'https://masfirmanpratama.com/wp-content/uploads/2024/11/ATc.jpg'},
            {id:'book4',name:'Buku Instan Hipnosis',price:'Rp250.000',desc:'Modul Hipnosis Modern untuk belajar dan praktik.',img:'https://masfirmanpratama.com/wp-content/uploads/2024/11/H5.jpg'},
            {id:'book5',name:'Kitab Kunci Penarik Rezeki',price:'Rp250.000',desc:'Kitab panduan Kunci Penarik Rezeki.',img:'https://masfirmanpratama.com/wp-content/uploads/2024/11/kpr2-tnpa-web.jpg'},
            {id:'class1',name:'AMC Reguler',price:'Rp4.500.000',desc:'Kelas AMC Reguler.',img:'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=90',amc:'regular'},
            {id:'class2',name:'AMC Privat',price:'Rp7.500.000',desc:'Kelas AMC Privat yang lebih personal.',img:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=90',amc:'private'},
            {id:'class3',name:'AMC Platinum',price:'Rp22.500.000',desc:'Program intensif AMC Platinum 3 hari.',img:'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=90',amc:'platinum'}
          ];
          function renderProducts(){
            const q=(document.getElementById('productSearch')?.value||'').toLowerCase();
            const a=products.filter(x=>(x.name+x.desc).toLowerCase().includes(q));
            const fallback='https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=900&q=90';
            document.getElementById('productsGrid').innerHTML=a.map(x=>`<div class="card product"><img src="${x.img}" alt="${x.name}" onerror="this.src='${fallback}'"><h3>${x.name}</h3><div class="muted">${x.desc}</div><div class="price">${x.price}</div><button class="btn primary" onclick="openProduct('${x.id}')">Lihat Detail</button></div>`).join('')||'<div class="empty">Produk tidak ditemukan.</div>';
          }
          '''
          s = s[:start] + replacement + s[end:]

          start = s.find('function loadImages(){')
          end = s.find('document.addEventListener', start)
          if start < 0 or end < 0:
              raise SystemExit('loadImages target not found')
          replacement = r'''function loadImages(){
            const fallback={
              regular:'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=90',
              private:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=90',
              platinum:'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=90'
            };
            const set=(selector,src)=>document.querySelectorAll(selector).forEach(i=>{i.src=src;i.onerror=()=>{i.src=fallback.regular;}});
            set('#classImg',fallback.regular);
            Object.entries(fallback).forEach(([k,src])=>set('[data-amc="'+k+'"]',src));
            fetch('https://masfirmanpratama.com/wp-json/wp/v2/media?search=kelas%20amc&per_page=30')
              .then(r=>r.ok?r.json():[]).then(items=>{
                const imgs=(items||[]).filter(x=>x&&x.source_url).map(x=>x.source_url).filter((v,i,a)=>a.indexOf(v)===i);
                if(!imgs.length)return;
                const selected=[imgs[0],imgs[1]||imgs[0],imgs[2]||imgs[1]||imgs[0]];
                ['regular','private','platinum'].forEach((k,i)=>set('[data-amc="'+k+'"]',selected[i]));
                set('#classImg',selected[0]);
                products.forEach(p=>{if(p.amc){p.img=selected[['regular','private','platinum'].indexOf(p.amc)]||p.img;}});
                renderProducts();
              }).catch(()=>{});
          }
          '''
          s = s[:start] + replacement + s[end:]
          path.write_text(s, encoding='utf-8')

      - name: Commit patched demo
        run: |
          git config user.name "JFS AI Technology"
          git config user.email "jfs-ai-technology@users.noreply.github.com"
          git add mas-firman-pratama/demo.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Mas Firman catalog and AMC class photos"
          git push
