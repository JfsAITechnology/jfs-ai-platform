name: Use main JFS AI logo in Mas Firman demo
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Use main JFS AI logo in Mas Firman demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch demo logo source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mas-firman-pratama/demo.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="logo.jpg"','src="../jfs-ai-logo.svg"',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'JFS AI Technology'
          git config user.email '316434542+JfsAITechnology@users.noreply.github.com'
          git add mas-firman-pratama/demo.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use main JFS AI logo in Mas Firman demo'
          git push
