<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI Admin — Subscription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#087cf0;color:#fff;font-weight:700}.muted{color:#68758b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.pill{padding:5px 9px;border-radius:999px;background:#e8f5e9;display:inline-block}.danger{background:#fee;color:#b42318}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{padding:10px;border:1px solid #d5dce8;border-radius:8px}.hidden{display:none}</style></head>
<body><div class="wrap"><div id="login" class="card"><h1>JFS AI Admin</h1><p class="muted">Subscription & Tenant Management</p><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></div><div id="app" class="hidden"><div class="row"><h1 style="flex:1">Subscription Manager</h1><button id="logout">Logout</button></div><div id="stats" class="grid"></div><div class="card"><div class="row"><input id="search" placeholder="Cari tenant..."><button id="refresh">Refresh</button></div><div id="list" style="margin-top:15px"></div></div></div></div>
<script>
const URL='https://evtkeyfjgqwarsmlzrkh.supabase.co', KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD'; const sb=supabase.createClient(URL,KEY); let tenants=[];
const $=id=>document.getElementById(id);
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data,error}=await sb.from('jfs_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
async function login(){ $('loginMsg').textContent='Memeriksa...'; const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error){$('loginMsg').textContent=error.message;return} if(!(await isAdmin())){await sb.auth.signOut();$('loginMsg').textContent='Akun bukan admin JFS AI.';return} showApp();load();}
async function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden'); }
async function load(){const {data,error}=await sb.from('tenants').select('id,name,slug,status').order('name');if(error){$('list').textContent=error.message;return} tenants=data||[];render();}
function render(){const q=$('search').value.toLowerCase();const rows=tenants.filter(t=>(t.name||'').toLowerCase().includes(q));$('stats').innerHTML=`<div class="card"><b>${tenants.length}</b><br>Tenant</div>`; $('list').innerHTML=rows.map(t=>`<div class="card"><h3>${t.name}</h3><p class="muted">${t.slug||''}</p><div id="sub-${t.id}">Memuat subscription...</div></div>`).join('');rows.forEach(loadSub)}
async function loadSub(t){const {data}=await sb.from('tenant_subscriptions').select('*').eq('tenant_id',t.id).order('end_date',{ascending:false}).limit(1).maybeSingle();const el=$('sub-'+t.id);if(!data){el.innerHTML='<span class="pill danger">EXPIRED / BELUM AKTIF</span><div class="row" style="margin-top:10px"><select id="plan-'+t.id+'"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option></select><button onclick="activate(\''+t.id+'\')">Aktifkan</button></div>';return} const expired=new Date(data.end_date+'T00:00:00')<=new Date(); el.innerHTML=`<span class="pill ${expired||data.status!=='active'?'danger':''}">${expired||data.status!=='active'?'EXPIRED':'ACTIVE'}</span><p>Berakhir: ${data.end_date}</p><div class="row"><select id="plan-${t.id}"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option></select><button onclick="activate('${t.id}')">${expired?'Aktifkan':'Perpanjang'}</button></div>`}
async function activate(id){const months=Number($('plan-'+id).value), now=new Date();const current=tenants.find(t=>t.id===id);const {data:old}=await sb.from('tenant_subscriptions').select('end_date').eq('tenant_id',id).eq('status','active').order('end_date',{ascending:false}).limit(1).maybeSingle();let start=new Date();if(old&&old.end_date&&new Date(old.end_date+'T00:00:00')>now)start=new Date(old.end_date+'T00:00:00');const end=new Date(start);end.setMonth(end.getMonth()+months);const fmt=d=>d.toISOString().slice(0,10);const {error}=await sb.from('tenant_subscriptions').insert({tenant_id:id,plan_id:months+'-months',start_date:fmt(start),end_date:fmt(end),status:'active'});if(error){alert(error.message);return}alert('Subscription berhasil diaktifkan sampai '+fmt(end));load()}
$('loginBtn').onclick=login;$('refresh').onclick=load;$('search').oninput=render;$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());
</script></body></html>
