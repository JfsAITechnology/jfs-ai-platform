<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFS AI Admin — Subscription & Tenant Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 0 8px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#087cf0;color:#fff;font-weight:700}button:disabled{opacity:.6;cursor:not-allowed}.muted{color:#68758b}.hidden{display:none}.msg{margin-top:12px;color:#b42318;white-space:pre-wrap}.ok{color:#067647}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f5e9;color:#067647}.danger{background:#fee;color:#b42318}.tenant{border:1px solid #e1e7f0;border-radius:12px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input{padding:10px;border:1px solid #d5dce8;border-radius:8px;min-width:180px;box-sizing:border-box}.login-card{max-width:620px;margin:8vh auto}.status{margin:10px 0;padding:10px;border-radius:8px;background:#f7f9fc}.error{color:#b42318}.success{color:#067647}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="card login-card">
<h1>🔐 JFS AI Admin</h1>
<p class="muted">Halaman ini khusus administrator JFS AI Technology.</p>
<form id="loginForm">
<div class="row">
<input id="email" type="email" autocomplete="username" placeholder="Email admin" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button id="loginBtn" type="submit">Login</button>
</div>
</form>
<p id="loginMsg" class="msg"></p>
</section>
<section id="app" class="hidden">
<div class="row" style="margin-bottom:18px">
<div style="flex:1"><h1>JFS AI Subscription Manager</h1><div id="adminIdentity" class="muted"></div></div>
<button id="refresh" type="button">Refresh</button><button id="logout" type="button">Logout</button>
</div>
<div id="stats" class="grid"></div>
<div class="card"><div class="row"><input id="search" placeholder="Cari nama bisnis / kode tenant..."></div><div id="list">Memuat tenant...</div></div>
</section>
</div>
<script>
'use strict';
const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co';
const SUPABASE_KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';
let db=null,tenants=[],plans=[],busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
function setMsg(text='',type=''){const el=$('loginMsg');el.textContent=text;el.className='msg '+(type==='success'?'ok':'');}
function friendlyAuthError(error){
 const m=String(error?.message||error||'Terjadi kesalahan.');
 if(/invalid login credentials/i.test(m))return 'Email atau password admin salah.';
 if(/email not confirmed/i.test(m))return 'Email akun belum dikonfirmasi di Supabase Auth.';
 if(/failed to fetch|network/i.test(m))return 'Koneksi ke server autentikasi gagal. Coba refresh halaman dan login lagi.';
 return m;
}
function makeClient(){
 if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Library Supabase belum termuat. Silakan refresh halaman.');
 if(!db)db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'jfs-ai-admin-auth'}});
 return db;
}
async function getAdminUser(){
 const client=makeClient();
 const {data:{user},error}=await client.auth.getUser();
 if(error)throw new Error('Pemeriksaan sesi gagal: '+friendlyAuthError(error));
 if(!user)return null;
 const {data,error:e}=await client.from('jfs_admins').select('user_id').eq('user_id',user.id).maybeSingle();
 if(e)throw new Error('Akses admin gagal diperiksa: '+e.message);
 return data&&data.user_id===user.id?user:null;
}
function openApp(user){
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('adminIdentity').textContent='Admin: '+(user.email||'Akun admin');
}
function showLogin(text=''){
 $('login').classList.remove('hidden');$('app').classList.add('hidden');
 if(text)setMsg(text);
}
async function start(){
 try{
  makeClient();
  const {data:{session},error}=await db.auth.getSession();
  if(error)throw error;
  if(!session){showLogin('');return;}
  const user=await getAdminUser();
  if(!user){await db.auth.signOut();showLogin('Sesi ditemukan, tetapi akun ini belum terdaftar sebagai admin JFS AI.');return;}
  openApp(user);
  await load();
 }catch(e){console.error(e);showLogin(friendlyAuthError(e));}
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 busy=true;$('loginBtn').disabled=true;$('loginBtn').textContent='Memeriksa...';setMsg('Memproses login...');
 try{
  const client=makeClient();
  await client.auth.signOut({scope:'local'});
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error)throw new Error('Login gagal: '+friendlyAuthError(error));
  if(!data?.user)throw new Error('Login gagal: user tidak ditemukan.');
  const admin=await getAdminUser();
  if(!admin){await client.auth.signOut({scope:'local'});throw new Error('Login berhasil, tetapi akun ini belum memiliki akses Admin JFS AI. Gunakan akun admin yang terdaftar.');}
  openApp(admin);setMsg('');
  try{await load();}catch(loadError){console.error(loadError);alert('Login berhasil. Namun data dashboard gagal dimuat: '+friendlyAuthError(loadError));}
 }catch(e){console.error(e);showLogin(friendlyAuthError(e));}
 finally{busy=false;$('loginBtn').disabled=false;$('loginBtn').textContent='Login';}
});
async function load(){
 const client=makeClient();
 const tr=await client.from('tenants').select('id,tenant_code,business_name,business_type,whatsapp,status').order('business_name');
 if(tr.error)throw new Error('Gagal membaca tenants: '+tr.error.message);
 const pr=await client.from('subscription_plans').select('id,name,duration_months,price').eq('is_active',true).order('duration_months');
 if(pr.error)throw new Error('Gagal membaca paket subscription: '+pr.error.message);
 tenants=tr.data||[];plans=pr.data||[];await render();
}
async function subscription(id){return await db.from('tenant_subscriptions').select('id,tenant_id,plan_id,start_date,end_date,status,amount,payment_status').eq('tenant_id',id).order('end_date',{ascending:false}).limit(1).maybeSingle();}
async function render(){
 const q=$('search').value.trim().toLowerCase();
 const rows=tenants.filter(t=>(t.business_name||'').toLowerCase().includes(q)||(t.tenant_code||'').toLowerCase().includes(q));
 $('stats').innerHTML='<div class="card"><b>'+tenants.length+'</b><br><small>Total Tenant</small></div><div class="card"><b>'+plans.length+'</b><br><small>Paket Subscription</small></div>';
 if(!rows.length){$('list').innerHTML='<p class="muted">Tidak ada tenant.</p>';return;}
 $('list').innerHTML=rows.map(t=>'<div class="tenant"><h3>'+esc(t.business_name)+'</h3><small>Kode: '+esc(t.tenant_code)+' • '+esc(t.business_type||'-')+' • Status tenant: '+esc(t.status)+'</small><div id="s-'+t.id+'" style="margin-top:12px">Memuat subscription...</div></div>').join('');
 for(const t of rows)await renderSub(t);
}
async function renderSub(t){
 const el=$('s-'+t.id),r=await subscription(t.id);
 if(r.error){el.innerHTML='<span class="pill danger">Gagal membaca subscription: '+esc(r.error.message)+'</span>';return;}
 const s=r.data;
 if(!s){el.innerHTML='<span class="pill danger">BELUM ADA SUBSCRIPTION</span>'+planButtons(t.id);return;}
 const expired=!s.end_date||new Date(s.end_date+'T00:00:00')<=new Date();
 const active=s.status==='active'&&!expired;
 el.innerHTML='<span class="pill '+(active?'':'danger')+'">'+(active?'ACTIVE':'LOCKED / '+esc(String(s.status||'unknown').toUpperCase()))+'</span><p>Periode: <b>'+fmt(s.start_date)+'</b> → <b>'+fmt(s.end_date)+'</b><br>Status pembayaran: '+esc(s.payment_status||'pending')+'</p>'+planButtons(t.id);
}
function planButtons(id){return '<div class="row">'+plans.map(p=>'<button type="button" onclick="activate(\''+id+'\',\''+p.id+'\')">Aktifkan '+esc(p.duration_months)+' Bulan</button>').join('')+'</div>';}
async function activate(tenantId,planId){
 if(!confirm('Aktifkan subscription tenant ini sekarang?'))return;
 try{
  const plan=plans.find(p=>p.id===planId);if(!plan)throw new Error('Paket tidak ditemukan.');
  const {data,error}=await db.rpc('renew_tenant_subscription',{p_tenant_id:tenantId,p_plan_id:plan.id,p_notes:'Diaktifkan oleh admin JFS AI'});
  if(error)throw error;
  alert('Berhasil. Akses aktif sampai '+fmt(data?.end_date));await load();
 }catch(e){console.error(e);alert('Gagal mengaktifkan subscription: '+friendlyAuthError(e));}
}
$('refresh').onclick=()=>load().catch(e=>alert(friendlyAuthError(e)));
$('search').oninput=()=>render();
$('logout').onclick=async()=>{try{await db.auth.signOut();}finally{$('email').value='';$('password').value='';showLogin('Anda sudah logout.');}};
window.addEventListener('pageshow',()=>{if(!db)start();});
start();
</script>
</body>
</html>
