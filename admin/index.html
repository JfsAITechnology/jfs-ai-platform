<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI Admin — Subscription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#087cf0;color:#fff;font-weight:700}button:disabled{opacity:.6}.muted{color:#68758b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.pill{padding:5px 9px;border-radius:999px;background:#e8f5e9;display:inline-block}.danger{background:#fee;color:#b42318}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{padding:10px;border:1px solid #d5dce8;border-radius:8px}.hidden{display:none}.msg{margin-top:12px;color:#b42318;white-space:pre-wrap}.ok{color:#067647}.tenant-card{border:1px solid #e1e7f0;border-radius:12px;padding:16px;margin-top:12px}</style></head>
<body><div class="wrap"><div id="login" class="card"><h1>JFS AI Admin</h1><p class="muted">Subscription & Tenant Management</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Email admin" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="loginBtn" type="submit">Login</button></form><p id="loginMsg" class="msg"></p></div><div id="app" class="hidden"><div class="row"><h1 style="flex:1">Subscription Manager</h1><span id="adminIdentity" class="muted"></span><button id="logout">Logout</button></div><div id="stats" class="grid"></div><div class="card"><div class="row"><input id="search" placeholder="Cari tenant..."><button id="refresh">Refresh</button></div><div id="list" style="margin-top:15px"></div></div></div></div>
<script>
const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co', SUPABASE_KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';
let sb=null,tenants=[];const $=id=>document.getElementById(id);
function setMsg(t,ok=false){$('loginMsg').textContent=t||'';$('loginMsg').className='msg'+(ok?' ok':'')}
async function init(){try{if(!window.supabase)throw new Error('Supabase library belum termuat. Refresh halaman.');sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(session){const admin=await getAdmin();if(admin){showApp(session.user);await load()}else await sb.auth.signOut()}}catch(e){console.error(e);setMsg(e.message||String(e))}}
async function getAdmin(){const {data:{user},error:uerr}=await sb.auth.getUser();if(uerr)throw new Error('Gagal membaca akun login: '+uerr.message);if(!user) return null;const {data,error}=await sb.from('jfs_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw new Error('Gagal memeriksa hak admin: '+error.message);return data&&data.user_id===user.id?user:null}
async function login(e){e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Login...';setMsg('');try{if(!sb)await init();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw new Error('Email dan password wajib diisi.');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error('Login gagal: '+error.message);if(!data.user)throw new Error('Login tidak mengembalikan user.');const admin=await getAdmin();if(!admin){await sb.auth.signOut();throw new Error('Login berhasil, tetapi akun ini belum terdaftar sebagai admin JFS AI.');}showApp(admin);await load()}catch(err){console.error(err);setMsg(err.message||String(err))}finally{b.disabled=false;b.textContent='Login'}}
function showApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('adminIdentity').textContent='Admin: '+(user.email||'')}
async function load(){const {data,error}=await sb.from('tenants').select('id,name,slug,status').order('name');if(error){$('list').textContent='Gagal memuat tenant: '+error.message;return}tenants=data||[];render()}
function render(){const q=$('search').value.toLowerCase();const rows=tenants.filter(t=>(t.name||'').toLowerCase().includes(q));$('stats').innerHTML=`<div class="card"><b>${tenants.length}</b><br>Tenant</div>`;$('list').innerHTML=rows.map(t=>`<div class="tenant-card"><h3>${escapeHtml(t.name)}</h3><p class="muted">${escapeHtml(t.slug||'')} • ${escapeHtml(t.status||'')}</p><div id="sub-${t.id}">Memuat subscription...</div></div>`).join('');rows.forEach(loadSub)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadSub(t){const {data,error}=await sb.from('tenant_subscriptions').select('*').eq('tenant_id',t.id).order('end_date',{ascending:false}).limit(1).maybeSingle();const el=$('sub-'+t.id);if(!el)return;if(error){el.textContent='Gagal memuat subscription: '+error.message;return}if(!data){el.innerHTML='<span class="pill danger">EXPIRED / BELUM AKTIF</span><div class="row" style="margin-top:10px"><select id="plan-'+t.id+'"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option></select><button onclick="activate(\''+t.id+'\')">Aktifkan</button></div>';return}const expired=!data.end_date||new Date(data.end_date+'T00:00:00')<=new Date();const active=data.status==='active'&&!expired;el.innerHTML=`<span class="pill ${active?'':'danger'}">${active?'ACTIVE':'EXPIRED / '+String(data.status||'').toUpperCase()}</span><p>Mulai: ${data.start_date||'-'}<br>Berakhir: ${data.end_date||'-'}</p><div class="row"><select id="plan-${t.id}"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="12">12 Bulan</option></select><button onclick="activate('${t.id}')">${active?'Perpanjang':'Aktifkan'}</button></div>`}
async function activate(id){try{const months=Number($('plan-'+id).value),now=new Date();const {data:old,error:oldErr}=await sb.from('tenant_subscriptions').select('end_date').eq('tenant_id',id).eq('status','active').order('end_date',{ascending:false}).limit(1).maybeSingle();if(oldErr)throw oldErr;let start=new Date();if(old&&old.end_date&&new Date(old.end_date+'T00:00:00')>now)start=new Date(old.end_date+'T00:00:00');const end=new Date(start);end.setMonth(end.getMonth()+months);const fmt=d=>d.toISOString().slice(0,10);const {error}=await sb.from('tenant_subscriptions').insert({tenant_id:id,plan_id:months+'-months',start_date:fmt(start),end_date:fmt(end),status:'active'});if(error)throw error;alert('Subscription berhasil diaktifkan sampai '+fmt(end));await load()}catch(e){console.error(e);alert('Gagal aktivasi: '+(e.message||e))}}
$('loginForm').addEventListener('submit',login);$('refresh').onclick=load;$('search').oninput=render;$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};init();
</script></body></html>
