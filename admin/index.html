<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI Admin — Subscription & Tenant Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,Arial;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 0 8px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#087cf0;color:#fff;font-weight:700}button:disabled{opacity:.6}.muted{color:#68758b}.hidden{display:none}.msg{margin-top:12px;color:#b42318;white-space:pre-wrap}.ok{color:#067647}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f5e9;color:#067647}.danger{background:#fee;color:#b42318}.tenant{border:1px solid #e1e7f0;border-radius:12px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input{padding:10px;border:1px solid #d5dce8;border-radius:8px}</style></head><body><div class="wrap"><section id="login" class="card"><h1>🔐 JFS AI Admin</h1><p class="muted">Halaman ini khusus administrator JFS AI Technology.</p><form id="loginForm" class="row"><input id="email" type="email" autocomplete="username" placeholder="Email admin" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="loginBtn">Login</button></form><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="row" style="margin-bottom:18px"><div style="flex:1"><h1>JFS AI Subscription Manager</h1><div id="adminIdentity" class="muted"></div></div><button id="refresh">Refresh</button><button id="logout">Logout</button></div><div id="stats" class="grid"></div><div class="card"><div class="row"><input id="search" placeholder="Cari nama bisnis / kode tenant..."></div><div id="list">Memuat tenant...</div></div></section></div><script>
const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co';const SUPABASE_KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';let db,tenants=[],plans=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';function msg(t,ok=false){$('loginMsg').textContent=t||'';$('loginMsg').className='msg '+(ok?'ok':'')}function make(){if(!window.supabase||typeof window.supabase.createClient!=='function')throw Error('Library Supabase belum termuat.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}async function isAdmin(){const {data:{user},error}=await db.auth.getUser();if(error)throw Error('Auth: '+error.message);if(!user)return null;const {data,error:e}=await db.from('jfs_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(e)throw Error('Cek admin gagal: '+e.message);return data?.user_id===user.id?user:null}async function start(){try{make();const {data:{session}}=await db.auth.getSession();if(session){const u=await isAdmin();if(u){open(u);await load()}else{await db.auth.signOut();showLogin('Sesi ditemukan tetapi akun tidak memiliki akses admin. Silakan login dengan akun admin JFS AI.')}}else showLogin('')}catch(e){console.error(e);showLogin(e.message)}}function showLogin(t){$('login').classList.remove('hidden');$('app').classList.add('hidden');if(t)msg(t)}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginBtn').textContent='Login...';msg('');try{if(!db)make();const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw Error('Login gagal: '+error.message);const u=await isAdmin();if(!u){await db.auth.signOut();throw Error('Login berhasil, tetapi akun ini belum terdaftar sebagai admin JFS AI.')}open(u);await load()}catch(e){console.error(e);msg(e.message)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Login'}};function open(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('adminIdentity').textContent='Admin: '+(u.email||'')+' • User ID: '+u.id}async function load(){const tr=await db.from('tenants').select('id,tenant_code,business_name,business_type,whatsapp,status').order('business_name');if(tr.error)throw Error('Gagal membaca tenants: '+tr.error.message);const pr=await db.from('subscription_plans').select('id,name,duration_months,price').eq('is_active',true).order('duration_months');if(pr.error)throw Error('Gagal membaca paket subscription: '+pr.error.message);tenants=tr.data||[];plans=pr.data||[];render()}async function subscription(id){return await db.from('tenant_subscriptions').select('id,tenant_id,plan_id,start_date,end_date,status,amount,payment_status').eq('tenant_id',id).order('end_date',{ascending:false}).limit(1).maybeSingle()}async function render(){const q=$('search').value.toLowerCase();const rows=tenants.filter(t=>(t.business_name||'').toLowerCase().includes(q)||(t.tenant_code||'').toLowerCase().includes(q));$('stats').innerHTML='<div class="card"><b>'+tenants.length+'</b><br><small>Total Tenant</small></div><div class="card"><b>'+plans.length+'</b><br><small>Paket Subscription</small></div>';if(!rows.length){$('list').innerHTML='<p class="muted">Tidak ada tenant.</p>';return}$('list').innerHTML=rows.map(t=>'<div class="tenant"><h3>'+esc(t.business_name)+'</h3><small>Kode: '+esc(t.tenant_code)+' • '+esc(t.business_type||'-')+' • Status tenant: '+esc(t.status)+'</small><div id="s-'+t.id+'" style="margin-top:12px">Memuat subscription...</div></div>').join('');for(const t of rows)await renderSub(t)}async function renderSub(t){const el=$('s-'+t.id),r=await subscription(t.id);if(r.error){el.innerHTML='<span class="danger">Gagal membaca subscription: '+esc(r.error.message)+'</span>';return}const s=r.data;if(!s){el.innerHTML='<span class="pill danger">BELUM ADA SUBSCRIPTION</span>'+planButtons(t.id);return}const expired=!s.end_date||new Date(s.end_date+'T00:00:00')<=new Date(),active=s.status==='active'&&!expired;el.innerHTML='<span class="pill '+(active?'':'danger')+'">'+(active?'ACTIVE':'LOCKED / '+esc(s.status.toUpperCase()))+'</span><p>Periode: <b>'+fmt(s.start_date)+'</b> → <b>'+fmt(s.end_date)+'</b><br>Status pembayaran: '+esc(s.payment_status||'pending')+'</p>'+planButtons(t.id)}function planButtons(id){return '<div class="row">'+plans.map(p=>'<button onclick="activate(\''+id+'\',\''+p.id+'\')">Aktifkan '+esc(p.duration_months)+' Bulan</button>').join('')+'</div>'}async function activate(tenantId,planId){if(!confirm('Aktifkan subscription tenant ini sekarang?'))return;try{const plan=plans.find(p=>p.id===planId);if(!plan)throw Error('Paket tidak ditemukan.');const now=new Date();const old=await db.from('tenant_subscriptions').select('end_date').eq('tenant_id',tenantId).eq('status','active').order('end_date',{ascending:false}).limit(1).maybeSingle();if(old.error)throw old.error;let start=now;if(old.data?.end_date&&new Date(old.data.end_date+'T00:00:00')>now)start=new Date(old.data.end_date+'T00:00:00');const end=new Date(start);end.setMonth(end.getMonth()+plan.duration_months);const date=d=>d.toISOString().slice(0,10);const ins=await db.from('tenant_subscriptions').insert({tenant_id:tenantId,plan_id:plan.id,start_date:date(start),end_date:date(end),status:'active',amount:plan.price||0,payment_status:'paid',auto_renew:false,notes:'Diaktifkan oleh admin JFS AI'});if(ins.error)throw ins.error;alert('Berhasil. Akses aktif sampai '+date(end));await load()}catch(e){console.error(e);alert('Gagal mengaktifkan subscription: '+(e.message||e))}}$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('search').oninput=()=>render();$('logout').onclick=async()=>{await db.auth.signOut();showLogin('Anda sudah logout.');$('email').value='';$('password').value=''};start();</script></body></html>
