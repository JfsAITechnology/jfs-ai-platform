<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI Customer Service — Tenant</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#07101f;--panel:#0d1931;--input:#081225;--text:#f5f8ff;--muted:#91a0bd;--line:#ffffff18;--blue:#0879ff;--cyan:#12d7ff;--green:#18a66a;--danger:#ff6673}body.light{--bg:#f4f7fb;--panel:#fff;--input:#f7f9fc;--text:#152033;--muted:#66748b;--line:#172b4618}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.wrap{max-width:520px;margin:6vh auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:50%;border:2px solid var(--cyan);background:#10284a;object-fit:contain;padding:5px;cursor:pointer}.h{font-size:24px;font-weight:800;margin-top:24px}.muted{font-size:12px;color:var(--muted);line-height:1.6}.field{margin:11px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.input,select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--input);color:var(--text);outline:none}.btn{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--input);color:var(--text);cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.status{min-height:20px;margin:9px 0;font-size:11px;line-height:1.5}.ok{color:#45e39f}.err{color:var(--danger)}.notice{margin-top:12px;padding:11px;border-radius:9px;background:#0879ff12;border:1px solid #0879ff30;color:var(--muted);font-size:11px;line-height:1.5}.row{display:flex;gap:8px}.row .btn{flex:1}.toggle{margin-top:8px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.modal img{width:min(320px,75vw);height:min(320px,75vw);object-fit:contain;background:#10284a;border:5px solid var(--cyan);border-radius:50%;padding:25px}@media(max-width:560px){.wrap{margin:2vh auto}}
</style></head><body><main class="wrap"><section class="card"><div class="brand"><img class="logo" src="https://i.ibb.co.com/1GT94q8K/logo-JFS-AI-Tech-removebg-preview.png" onclick="openLogo()" alt="JFS AI"><div><b>JFS AI Customer Service</b><div class="muted">COMMERCIAL • TENANT</div></div></div><h1 id="title" class="h">Masuk</h1><p id="desc" class="muted">Kelola AI Customer Service bisnis Anda.</p><div id="reg" style="display:none"><div class="field"><label>NAMA BISNIS</label><input id="business" class="input" placeholder="Contoh: Toko Maju Jaya"></div><div class="field"><label>JENIS BISNIS</label><select id="type" class="input"><option>Toko</option><option>Kuliner</option><option>Barbershop</option><option>Laundry</option><option>Service AC</option><option>Jasa</option><option>Lainnya</option></select></div><div class="field"><label>NAMA PEMILIK</label><input id="name" class="input" placeholder="Nama Anda"></div><div class="field"><label>WHATSAPP BISNIS</label><input id="wa" class="input" placeholder="628xxxxxxxxxx"></div></div><div class="field"><label>EMAIL</label><input id="email" class="input" type="email" autocomplete="email"></div><div class="field"><label>PASSWORD</label><input id="password" class="input" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></div><button id="submit" class="btn primary" onclick="submitAuth()">Masuk</button><div id="status" class="status"></div><button id="toggle" class="btn toggle" onclick="toggleMode()">Belum punya akun? Daftar</button><div class="row" style="margin-top:8px"><button class="btn" onclick="theme('dark')">🌙 Gelap</button><button class="btn" onclick="theme('light')">☀️ Terang</button></div><div class="notice">Subscription tahap awal menggunakan website. Setelah akun aktif, Anda dapat mengajukan paket dan konfirmasi pembayaran melalui WhatsApp JFS AI.</div></section></main><div id="modal" class="modal" onclick="closeLogo()"><img src="https://i.ibb.co.com/1GT94q8K/logo-JFS-AI-Tech-removebg-preview.png" onclick="event.stopPropagation()"></div><script>const URL='https://evtkeyfjgqwarsmlzrkh.supabase.co';const KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';const sb=supabase.createClient(URL,KEY);const APP='ai-customer-service-commercial.html';let registerMode=false;const $=id=>document.getElementById(id);function theme(t){document.body.classList.toggle('light',t==='light');localStorage.jfsTheme=t}if(localStorage.jfsTheme==='light')theme('light');function openLogo(){$('modal').classList.add('show')}function closeLogo(){$('modal').classList.remove('show')}function setStatus(text,type=''){const s=$('status');s.textContent=text;s.className='status '+type}function toggleMode(){registerMode=!registerMode;$('reg').style.display=registerMode?'block':'none';$('title').textContent=registerMode?'Daftar Tenant':'Masuk';$('desc').textContent=registerMode?'Buat akun bisnis. Setelah berhasil, Anda akan diarahkan ke dashboard.':'Kelola AI Customer Service bisnis Anda.';$('submit').textContent=registerMode?'Daftar & Mulai':'Masuk';$('toggle').textContent=registerMode?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';setStatus('')}async function ensureTenant(){const {data,error}=await sb.rpc('ensure_tenant_for_user');if(error)throw error;if(!data)throw Error('Tenant belum berhasil dibuat.')}async function submitAuth(){const email=$('email').value.trim(),password=$('password').value;if(!email)return setStatus('Email wajib diisi.','err');if(password.length<6)return setStatus('Password minimal 6 karakter.','err');$('submit').disabled=true;setStatus(registerMode?'Membuat akun...':'Memeriksa akun...');try{if(registerMode){const business=$('business').value.trim();if(!business)return setStatus('Nama bisnis wajib diisi.','err');const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href, data:{business_name:business,business_type:$('type').value,full_name:$('name').value.trim(),whatsapp:$('wa').value.trim()}}});if(error)throw error;if(data.session){setStatus('Akun berhasil dibuat. Menyiapkan tenant...','ok');await ensureTenant();goApp()}else{registerMode=false;$('reg').style.display='none';$('title').textContent='Masuk';$('desc').textContent='Akun berhasil dibuat. Cek email Anda untuk konfirmasi, lalu login.';$('submit').textContent='Masuk';$('toggle').textContent='Belum punya akun? Daftar';setStatus('✓ Pendaftaran berhasil. Silakan cek email konfirmasi, kemudian kembali ke halaman ini dan login.','ok')}}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;setStatus('Login berhasil. Menyiapkan tenant...','ok');await ensureTenant();goApp()}}catch(e){setStatus(e.message||'Terjadi kesalahan. Silakan coba lagi.','err')}finally{$('submit').disabled=false}}function goApp(){location.href=APP+'?v='+Date.now()}sb.auth.getSession().then(async({data})=>{if(data.session){try{await ensureTenant();goApp()}catch(e){setStatus(e.message||'Sesi ada, tetapi tenant belum siap.','err')}}});document.addEventListener('keydown',e=>e.key==='Escape'&&closeLogo())</script></body></html>
