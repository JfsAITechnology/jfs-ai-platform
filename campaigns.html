<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Campaigns</title><style>body{font-family:Arial;background:#060b18;color:#f4f7ff;margin:0;padding:30px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.panel,.card{background:#0d1630;border:1px solid #ffffff14;border-radius:14px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat strong{display:block;font-size:28px;margin-top:8px}.muted{color:#91a0bd;font-size:12px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#1687ff;color:white;cursor:pointer}.secondary{background:#15264b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;color:#91a0bd;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #ffffff14;background:#080f21;color:white;box-sizing:border-box}.field textarea{min-height:100px}.wide{grid-column:1/-1}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #ffffff0d}.badge{padding:5px 8px;border-radius:12px;background:#26d98b18;color:#45e39f;font-size:10px}.draft{background:#ffd45c18;color:#ffd45c}.failed{background:#ff6b7a18;color:#ff8290}@media(max-width:750px){.grid,.form{grid-template-columns:1fr}.top{gap:12px;flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="top"><div><h1>📣 JFS AI Campaigns</h1><div class="muted">Marketing automation untuk tenant JFS AI</div></div><button class="btn" onclick="location.href='index.html'">← Kembali ke Platform</button></div><div class="grid"><div class="card"><div class="muted">Total Campaign</div><div class="stat"><strong id="total">0</strong></div></div><div class="card"><div class="muted">Scheduled</div><div class="stat"><strong id="scheduled">0</strong></div></div><div class="card"><div class="muted">Completed</div><div class="stat"><strong id="completed">0</strong></div></div></div><div class="panel"><h2>Buat Campaign</h2><div class="muted">Buat kampanye, tentukan audience, channel dan waktu pengiriman.</div><div class="form" style="margin-top:18px"><div class="field"><label>Nama Campaign</label><input id="name" placeholder="Contoh: Promo Laundry Agustus"></div><div class="field"><label>Audience</label><select id="audience"><option>Semua Contacts</option><option>New Leads</option><option>Customers</option><option>Returning Customers</option><option>Inactive Customers</option></select></div><div class="field"><label>Channel</label><select id="channel"><option>WhatsApp</option><option>Instagram</option><option>Email</option></select></div><div class="field"><label>Jadwal</label><input id="schedule" type="datetime-local"></div><div class="field wide"><label>Pesan Campaign</label><textarea id="message" placeholder="Tulis pesan promosi..."></textarea></div><div class="wide"><button class="btn" onclick="createCampaign()">+ Simpan Campaign</button></div></div></div><div class="panel"><h2>Campaign Saya</h2><table class="table"><thead><tr><th>Campaign</th><th>Audience</th><th>Channel</th><th>Schedule</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const key='jfs_campaigns';let data=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(data));render()}function createCampaign(){const name=document.getElementById('name').value.trim(),message=document.getElementById('message').value.trim();if(!name||!message){alert('Nama campaign dan pesan wajib diisi.');return}data.push({id:Date.now(),name,audience:audience.value,channel:channel.value,schedule:schedule.value||'-',message,status:schedule.value?'Scheduled':'Draft'});save();document.getElementById('name').value='';document.getElementById('message').value='';alert('Campaign berhasil disimpan. Pengiriman nyata akan diaktifkan setelah channel API terhubung.')}function run(id){const c=data.find(x=>x.id===id);if(!c)return;c.status='Running';save();setTimeout(()=>{c.status='Completed';save()},800);alert('Campaign masuk status Running. Ini masih simulasi UI sampai provider messaging terhubung.')}function removeCampaign(id){data=data.filter(x=>x.id!==id);save()}function render(){rows.innerHTML=data.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.message).slice(0,70)}</span></td><td>${esc(c.audience)}</td><td>${esc(c.channel)}</td><td>${esc(c.schedule)}</td><td><span class="badge ${c.status==='Draft'?'draft':c.status==='Failed'?'failed':''}">${c.status}</span></td><td>${c.status!=='Completed'?`<button class="btn" onclick="run(${c.id})">Run</button>`:''} <button class="btn secondary" onclick="removeCampaign(${c.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Belum ada campaign.</td></tr>';total.textContent=data.length;scheduled.textContent=data.filter(x=>x.status==='Scheduled').length;completed.textContent=data.filter(x=>x.status==='Completed').length}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();</script></body></html>
