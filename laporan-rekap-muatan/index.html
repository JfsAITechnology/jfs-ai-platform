<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Rekap Muatan & Uang Saku</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px Roboto,Arial}.top{background:#0b1220;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}.top img,.projectbar img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px}.top small{display:block;color:#cbd5e1;margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:14px;margin-bottom:12px}.projectbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:12px;margin-bottom:12px}.projectbar img{width:62px;height:62px}.projectbar .add{flex:0 1 430px}.form,.grid,.actions,.tabs{display:flex;gap:9px;flex-wrap:wrap}.field{flex:1;min-width:145px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#087cf5;color:white}.secondary{background:#e8eef7}.danger{background:#fee2e2;color:#b42318}.tab{background:#fff;border:1px solid #d9e0ea}.active{background:#087cf5;color:#fff}.stat{flex:1;min-width:130px}.num{font-size:24px;font-weight:900;margin-top:5px}.hide{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:8px;border:1px solid #d7dee8;text-align:left;font-size:12px;white-space:nowrap}th{background:#f1f5f9}@media(max-width:500px){.field{min-width:100%}.projectbar{align-items:flex-start}.projectbar img{width:52px;height:52px}}</style></head><body><header class="top"><div><b>JFS AI Technology</b><small>Rekap Muatan Logistik & Uang Saku Driver</small></div></header><main class="wrap"><div class="projectbar"><div class="add"><b>Tambah Project / Vendor</b><div class="form" style="margin-top:7px"><input id="newProject" placeholder="Nama PT/Vendor" style="flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:8px"><button class="primary" onclick="addProject()">+ Project</button></div></div><img src="assets/jfs-ai-logo.jpg" onerror="this.style.display='none'"></div><div class="card"><div class="form"><div class="field"><label>Project / Vendor Aktif</label><select id="project" onchange="switchProject()"></select></div><div class="field"><label>Tanggal</label><input id="date" type="date" onchange="render()"></div></div><b>Hari: <span id="day">-</span></b></div><div class="tabs"><button class="tab active" onclick="page('dash',this)">Dashboard</button><button class="tab" onclick="page('entry',this)">Input Muatan</button><button class="tab" onclick="page('cash',this)">Uang Saku</button><button class="tab" onclick="page('history',this)">Riwayat & Export</button></div><section id="dash"><div class="grid"><div class="card stat">Total Muatan<div class="num" id="kg">0</div></div><div class="card stat">Jumlah Driver<div class="num" id="drivers">0</div></div><div class="card stat">Uang Saku<div class="num" id="spent">Rp0</div></div><div class="card stat">Saldo Tersisa<div class="num" id="balance">Rp0</div></div></div><div class="card"><h3>Rekap Hari Ini</h3><div id="dashTable" class="scroll"></div></div></section><section id="entry" class="hide"><div class="card"><h3 id="formTitle">Tambah Data Driver</h3><div class="form"><div class="field"><label>No Urut</label><input id="no" readonly></div><div class="field"><label>Driver</label><input id="driver"></div><div class="field"><label>Nopol</label><input id="nopol"></div><div class="field"><label>Jenis Mobil</label><input id="vehicle"></div><div class="field"><label>Ton/CBM/Rit</label><input id="load"></div><div class="field"><label>Tujuan</label><input id="destination"></div><div class="field"><label>Uang Saku — input manual</label><input id="entryCash" type="number" min="0" value="0"></div><div class="field"><label>Sisa Uang Saku — input manual</label><input id="remaining" type="number" min="0" value="0"></div><div class="field"><label>Remark</label><input id="remark"></div></div><div class="actions"><button class="primary" onclick="saveEntry()">Simpan</button><button class="secondary" onclick="clearForm()">Bersihkan</button></div></div><div class="card"><h3>Data Muatan</h3><div id="entryTable" class="scroll"></div></div></section><section id="cash" class="hide"><div class="card"><h3>Saldo & Tambahan Uang Saku</h3><div class="form"><div class="field"><label>Saldo Awal</label><input id="opening" type="number" min="0"></div><div class="field"><label>Tambahan</label><input id="addition" type="number" min="0"></div><div class="field"><label>Keterangan</label><input id="cashNote"></div><button class="primary" onclick="saveCash()">Simpan Kas</button></div><p id="cashSummary"></p></div></section><section id="history" class="hide"><div class="card"><h3>Riwayat & Export</h3><div class="actions"><button class="primary" onclick="exportPDF()">📄 Export PDF</button><button class="primary" onclick="exportExcel()">📊 Export Excel</button></div><p style="font-size:12px;color:#64748b">Export menggunakan Project dan tanggal aktif.</p><div id="historyTable" class="scroll"></div></div></section></main><script>const $=id=>document.getElementById(id),logoURL='assets/jfs-ai-logo.jpg',money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');let db=JSON.parse(localStorage.getItem('jfs_rekap_v2')||'{"projects":["Umum"],"entries":[],"cash":[]}'),editId=null;function save(){localStorage.setItem('jfs_rekap_v2',JSON.stringify(db));render()}function current(){return{project:$('project').value,date:$('date').value}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rows(){let c=current();return db.entries.filter(e=>e.project===c.project&&e.date===c.date)}function nextNo(){let c=current();return db.entries.filter(e=>e.project===c.project&&e.date===c.date).reduce((m,e)=>Math.max(m,Number(e.no)||0),0)+1}function table(data,heads){return '<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function renderProjects(){let old=$('project').value;$('project').innerHTML=db.projects.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');if(db.projects.includes(old))$('project').value=old}function addProject(){let p=$('newProject').value.trim();if(!p)return alert('Isi nama project');if(!db.projects.includes(p))db.projects.push(p);$('newProject').value='';renderProjects();$('project').value=p;clearForm();save()}function switchProject(){clearForm();render()}function page(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function clearForm(){editId=null;$('formTitle').textContent='Tambah Data Driver';['driver','nopol','vehicle','load','destination','remark'].forEach(x=>$(x).value='');$('entryCash').value=0;$('remaining').value=0;$('no').value=nextNo()}function saveEntry(){if(!$('driver').value.trim())return alert('Nama driver wajib diisi');let c=current(),old=db.entries.find(x=>x.id===editId),e={id:editId||Date.now(),project:c.project,date:c.date,no:old?old.no:nextNo(),driver:$('driver').value,nopol:$('nopol').value,vehicle:$('vehicle').value,load:$('load').value,destination:$('destination').value,cash:Number($('entryCash').value)||0,remaining:Number($('remaining').value)||0,remark:$('remark').value},i=db.entries.findIndex(x=>x.id===editId);if(i>=0)db.entries[i]=e;else db.entries.push(e);clearForm();save()}function editEntry(id){let e=db.entries.find(x=>x.id===id);if(!e)return;editId=id;$('formTitle').textContent='Edit Data Driver';['no','driver','nopol','vehicle','load','destination','entryCash','remaining','remark'].forEach((k,i)=>$(k).value=[e.no,e.driver,e.nopol,e.vehicle,e.load,e.destination,e.cash,e.remaining,e.remark][i]);page('entry',document.querySelectorAll('.tab')[1])}function delEntry(id){if(confirm('Hapus data ini?')){db.entries=db.entries.filter(e=>e.id!==id);save()}}function saveCash(){let c=current(),i=db.cash.findIndex(x=>x.project===c.project&&x.date===c.date),o={project:c.project,date:c.date,opening:Number($('opening').value)||0,addition:Number($('addition').value)||0,note:$('cashNote').value};if(i>=0)db.cash[i]=o;else db.cash.push(o);save();alert('Kas tersimpan')}function longDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'-'}function report(){return rows().map(e=>({No:e.no,Driver:e.driver,Nopol:e.nopol,'Jenis Mobil':e.vehicle,'Ton/CBM/Rit':e.load,Tujuan:e.destination,'Uang Saku':e.cash,'Sisa Uang Saku':e.remaining,Remark:e.remark}))}function cashSummary(){let c=current(),es=rows(),ca=db.cash.find(x=>x.project===c.project&&x.date===c.date)||{};let spent=es.reduce((a,e)=>a+(Number(e.cash)||0),0);return{addition:Number(ca.addition)||0,balance:(Number(ca.opening)||0)+(Number(ca.addition)||0)-spent}}function exportPDF(){let r=report();if(!r.length)return alert('Belum ada data untuk Project dan tanggal aktif.');if(!window.jspdf?.jsPDF)return alert('Library PDF belum siap. Refresh halaman.');let {jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4'),s=cashSummary(),heads=['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark'],body=r.map(e=>[e.No,e.Driver,e.Nopol,e['Jenis Mobil'],e['Ton/CBM/Rit'],e.Tujuan,money(e['Uang Saku']),money(e['Sisa Uang Saku']),e.Remark]);doc.setTextColor(13,59,102);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('REKAP MUATAN & UANG SAKU DRIVER',148.5,14,{align:'center'});let im=new Image();im.crossOrigin='anonymous';im.src=logoURL;let draw=()=>{try{doc.addImage(im,'JPEG',136.5,18,24,24)}catch(e){}doc.setTextColor(153,153,153);doc.setFont('helvetica','italic');doc.setFontSize(8);doc.text('powered by : JFS AI Technology',148.5,47,{align:'center'});doc.setDrawColor(21,101,192);doc.line(14,53,283,53);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text('Tanggal',14,61);doc.text('Project / Vendor',14,70);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(13,59,102);doc.text(longDate(current().date),14,66);doc.text(current().project,14,75);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(153,153,153);doc.text('Sisa Uang Hari Ini',283,61,{align:'right'});doc.text('Tambahan Uang Saku Hari Ini',283,70,{align:'right'});doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(13,59,102);doc.text(money(s.balance),283,66,{align:'right'});doc.setFontSize(10);doc.text(money(s.addition),283,75,{align:'right'});if(typeof doc.autoTable!=='function')return alert('Modul tabel PDF belum termuat. Refresh halaman.');doc.autoTable({startY:81,head:[heads],body,theme:'grid',margin:{left:14,right:14},styles:{fontSize:8.5,cellPadding:2,lineColor:[153,153,153],lineWidth:.15},headStyles:{fillColor:[21,101,192],textColor:[255,255,255],fontStyle:'bold',halign:'center'},columnStyles:{0:{halign:'center'},4:{halign:'center'},6:{halign:'right'},7:{halign:'right'}},didDrawPage:()=>{doc.setFontSize(7);doc.setTextColor(153,153,153);doc.text('powered by : JFS AI Technology  |  Halaman '+doc.internal.getNumberOfPages(),148.5,204,{align:'center'})}});doc.save('rekap-muatan-'+current().date+'.pdf')};if(im.complete&&im.naturalWidth)draw();else{im.onload=draw;im.onerror=draw}}function exportExcel(){let r=report();if(!r.length)return alert('Belum ada data untuk Project dan tanggal aktif.');let s=cashSummary(),heads=['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark'],aoa=[['REKAP MUATAN & UANG SAKU DRIVER','','','','','','','',''],['powered by : JFS AI Technology','','','','','','','',''],['','','','','','','','',''],['Tanggal',longDate(current().date),'','','','','Sisa Uang Hari Ini',money(s.balance),''],['Project / Vendor',current().project,'','','','','Tambahan Uang Saku',money(s.addition),''],['','','','','','','','',''],heads,...r.map(e=>[e.No,e.Driver,e.Nopol,e['Jenis Mobil'],e['Ton/CBM/Rit'],e.Tujuan,Number(e['Uang Saku'])||0,Number(e['Sisa Uang Saku'])||0,e.Remark])],ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];ws['!cols']=[{wch:6},{wch:18},{wch:12},{wch:16},{wch:12},{wch:18},{wch:14},{wch:14},{wch:24}];ws['!freeze']={xSplit:0,ySplit:7};ws['!autofilter']={ref:'A7:I'+(7+r.length)};let b={style:'thin',color:{rgb:'999999'}};for(let c=0;c<9;c++){let x=ws[XLSX.utils.encode_cell({r:6,c})];if(x)x.s={fill:{fgColor:{rgb:'1565C0'}},font:{bold:true,color:{rgb:'FFFFFF'}},alignment:{horizontal:'center'},border:{top:b,bottom:b,left:b,right:b}}}for(let rr=7;rr<7+r.length;rr++)for(let cc=0;cc<9;cc++){let x=ws[XLSX.utils.encode_cell({r:rr,c:cc})];if(x){x.s={border:{top:b,bottom:b,left:b,right:b},alignment:{horizontal:cc===6||cc===7?'right':cc===0||cc===4?'center':'left',wrapText:true}};if(cc===6||cc===7)x.z='"Rp " #,##0'}}ws['A1'].s={font:{bold:true,sz:14,color:{rgb:'0D3B66'}},alignment:{horizontal:'center'}};ws['A2'].s={font:{italic:true,sz:9,color:{rgb:'999999'}},alignment:{horizontal:'center'}};ws['!pageSetup']={orientation:'landscape',fitToWidth:1,fitToHeight:0,paperSize:'9'};XLSX.utils.book_append_sheet(wb,ws,'Rekap Muatan');XLSX.writeFile(wb,'rekap-muatan-'+current().date+'.xlsx')}function render(){renderProjects();let c=current(),es=rows(),ca=db.cash.find(x=>x.project===c.project&&x.date===c.date)||{opening:0,addition:0},spent=es.reduce((a,e)=>a+Number(e.cash||0),0);$('day').textContent=c.date?new Date(c.date+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long'}):'-';$('kg').textContent=es.reduce((a,e)=>a+(parseFloat(e.load)||0),0).toLocaleString('id-ID');$('drivers').textContent=new Set(es.map(e=>e.driver)).size;$('spent').textContent=money(spent);$('balance').textContent=money(Number(ca.opening||0)+Number(ca.addition||0)-spent);let h=['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark','Aksi'];$('entryTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.vehicle),esc(e.load),esc(e.destination),money(e.cash),money(e.remaining),esc(e.remark),'<button onclick="editEntry('+e.id+')">✏️</button> <button class="danger" onclick="delEntry('+e.id+')">🗑️</button>']),h)||'Belum ada data';$('dashTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.destination),esc(e.load),money(e.cash)]),['No','Driver','Nopol','Tujuan','Muatan','Uang Saku'])||'Belum ada data';$('opening').value=ca.opening||0;$('addition').value=ca.addition||0;$('cashNote').value=ca.note||'';$('cashSummary').innerHTML='Saldo awal: <b>'+money(ca.opening)+'</b> · Tambahan: <b>'+money(ca.addition)+'</b> · Pengeluaran: <b>'+money(spent)+'</b> · Saldo akhir: <b>'+money(Number(ca.opening||0)+Number(ca.addition||0)-spent)+'</b>';$('historyTable').innerHTML=table(db.entries.map(e=>[e.date,e.project,'Muatan',e.driver,e.destination,e.load]).concat(db.cash.map(e=>[e.date,e.project,'Kas','Saldo awal',money(e.opening),money(e.addition)])),['Tanggal','Project','Jenis','Detail','Nilai 1','Nilai 2'])||'Belum ada riwayat'}$('date').value=new Date().toISOString().slice(0,10);renderProjects();clearForm();render();</script></body></html>
