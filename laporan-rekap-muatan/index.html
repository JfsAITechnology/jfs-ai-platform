<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Rekap Muatan & Uang Saku</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px Roboto,Arial}header{background:#0b1220;color:white;padding:12px 16px;display:flex;gap:12px;align-items:center}header img{width:45px;height:45px;object-fit:contain;background:white;border-radius:8px}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:white;border:1px solid #dfe6ef;border-radius:12px;padding:14px;margin-bottom:12px}.form,.grid,.actions,.tabs{display:flex;gap:9px;flex-wrap:wrap}.field{flex:1;min-width:145px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#087cf5;color:white}.secondary{background:#e8eef7}.danger{background:#fee2e2;color:#b42318}.tab{background:white;border:1px solid #d9e0ea}.active{background:#087cf5;color:white}.stat{flex:1;min-width:130px}.num{font-size:24px;font-weight:900;margin-top:5px}.hide{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:8px;border-bottom:1px solid #e5eaf0;text-align:left;font-size:12px;white-space:nowrap}th{background:#f1f5f9}@media(max-width:500px){.field{min-width:100%}}</style></head><body><header><img src="../mas-firman-pratama/assets/brand/jfs-ai-logo.jpg" onerror="this.style.display='none'"><div><b>JFS AI Technology</b><small>Rekap Muatan Logistik & Uang Saku Driver</small></div></header><main class="wrap"><div class="card"><div class="form"><div class="field"><label>Project / Vendor</label><select id="project"></select></div><div class="field"><label>Tambah Project</label><input id="newProject" placeholder="Nama PT/Vendor"></div><div class="field" style="align-self:end"><button class="primary" onclick="addProject()">+ Project</button></div><div class="field"><label>Tanggal</label><input id="date" type="date" onchange="render()"></div></div><b>Hari: <span id="day">-</span></b></div><div class="tabs"><button class="tab active" onclick="page('dash',this)">Dashboard</button><button class="tab" onclick="page('entry',this)">Input Muatan</button><button class="tab" onclick="page('cash',this)">Uang Saku</button><button class="tab" onclick="page('history',this)">Riwayat & Export</button></div><section id="dash"><div class="grid"><div class="card stat">Total Muatan<div class="num" id="kg">0</div></div><div class="card stat">Jumlah Driver<div class="num" id="drivers">0</div></div><div class="card stat">Uang Saku<div class="num" id="spent">Rp0</div></div><div class="card stat">Saldo Tersisa<div class="num" id="balance">Rp0</div></div></div><div class="card"><h3>Rekap Hari Ini</h3><div id="dashTable" class="scroll"></div></div></section><section id="entry" class="hide"><div class="card"><h3 id="formTitle">Tambah Data Driver</h3><div class="form"><div class="field"><label>No</label><input id="no" readonly></div><div class="field"><label>Driver</label><input id="driver"></div><div class="field"><label>Nopol</label><input id="nopol"></div><div class="field"><label>Jenis Mobil</label><input id="vehicle"></div><div class="field"><label>Ton/CBM/Rit</label><input id="load"></div><div class="field"><label>Tujuan</label><input id="destination"></div><div class="field"><label>Uang Saku</label><input id="entryCash" type="number" min="0" value="0"></div><div class="field"><label>Sisa Uang Saku</label><input id="remaining" type="number" min="0" value="0"></div><div class="field"><label>Remark</label><input id="remark"></div></div><div class="actions"><button class="primary" onclick="saveEntry()">Simpan</button><button class="secondary" onclick="clearForm()">Bersihkan</button></div></div><div class="card"><h3>Data Muatan</h3><div id="entryTable" class="scroll"></div></div></section><section id="cash" class="hide"><div class="card"><h3>Saldo & Tambahan Uang Saku</h3><div class="form"><div class="field"><label>Saldo Awal</label><input id="opening" type="number" min="0"></div><div class="field"><label>Tambahan</label><input id="addition" type="number" min="0"></div><div class="field"><label>Keterangan</label><input id="cashNote"></div><button class="primary" onclick="saveCash()">Simpan Kas</button></div><p id="cashSummary"></p></div></section><section id="history" class="hide"><div class="card"><h3>Riwayat & Export</h3><div class="actions"><button class="primary" onclick="exportPDF()">📄 PDF</button><button class="primary" onclick="exportExcel()">📊 Excel</button></div><div id="historyTable" class="scroll"></div></div></section></main><script>const $=id=>document.getElementById(id),money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');let db=JSON.parse(localStorage.getItem('jfs_rekap_v2')||'{"projects":["Umum"],"entries":[],"cash":[]}'),editId=null;function save(){localStorage.setItem('jfs_rekap_v2',JSON.stringify(db));render()}function current(){return{project:$('project').value,date:$('date').value}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rows(){return db.entries.filter(e=>e.project===current().project&&e.date===current().date)}function table(data,heads){return '<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function renderProjects(){let old=$('project').value;$('project').innerHTML=db.projects.map(p=>'<option>'+esc(p)+'</option>').join('');if(db.projects.includes(old))$('project').value=old}function addProject(){let p=$('newProject').value.trim();if(!p)return alert('Isi nama project');if(!db.projects.includes(p))db.projects.push(p);$('newProject').value='';renderProjects();$('project').value=p;save()}function page(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function clearForm(){editId=null;$('formTitle').textContent='Tambah Data Driver';['driver','nopol','vehicle','load','destination','remark'].forEach(x=>$(x).value='');$('entryCash').value=0;$('remaining').value=0;$('no').value=rows().length+1}function saveEntry(){if(!$('driver').value.trim())return alert('Nama driver wajib diisi');let c=current(),e={id:editId||Date.now(),project:c.project,date:c.date,no:+$('no').value,driver:$('driver').value,nopol:$('nopol').value,vehicle:$('vehicle').value,load:$('load').value,destination:$('destination').value,cash:+$('entryCash').value||0,remaining:+$('remaining').value||0,remark:$('remark').value},i=db.entries.findIndex(x=>x.id===editId);if(i>=0)db.entries[i]=e;else db.entries.push(e);clearForm();save()}function editEntry(id){let e=db.entries.find(x=>x.id===id);if(!e)return;editId=id;$('formTitle').textContent='Edit Data Driver';['no','driver','nopol','vehicle','load','destination','entryCash','remaining','remark'].forEach((k,i)=>$(k).value=[e.no,e.driver,e.nopol,e.vehicle,e.load,e.destination,e.cash,e.remaining,e.remark][i]);page('entry',document.querySelectorAll('.tab')[1])}function delEntry(id){if(confirm('Hapus data ini?')){db.entries=db.entries.filter(e=>e.id!==id);save()}}function saveCash(){let c=current(),i=db.cash.findIndex(x=>x.project===c.project&&x.date===c.date),o={project:c.project,date:c.date,opening:+$('opening').value||0,addition:+$('addition').value||0,note:$('cashNote').value};if(i>=0)db.cash[i]=o;else db.cash.push(o);save();alert('Kas tersimpan')}function report(){return rows().map(e=>({No:e.no,Driver:e.driver,Nopol:e.nopol,'Jenis Mobil':e.vehicle,'Ton/CBM/Rit':e.load,Tujuan:e.destination,'Uang Saku':e.cash,'Sisa Uang Saku':e.remaining,Remark:e.remark}))}function exportExcel(){let ws=XLSX.utils.json_to_sheet(report()),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap Muatan');XLSX.writeFile(wb,'rekap-muatan-'+current().date+'.xlsx')}function exportPDF(){let {jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4'),r=report();doc.text('JFS AI Technology — Rekap Muatan & Uang Saku',14,14);doc.text(current().project+' — '+current().date,14,22);doc.autoTable({startY:28,head:[Object.keys(r[0]||{No:'No'})],body:r.map(x=>Object.values(x))});doc.save('rekap-muatan-'+current().date+'.pdf')}function render(){renderProjects();let c=current(),es=rows(),ca=db.cash.find(x=>x.project===c.project&&x.date===c.date)||{opening:0,addition:0},spent=es.reduce((a,e)=>a+e.cash,0);$('day').textContent=c.date?new Date(c.date+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long'}):'-';$('kg').textContent=es.reduce((a,e)=>a+(parseFloat(e.load)||0),0).toLocaleString('id-ID');$('drivers').textContent=new Set(es.map(e=>e.driver)).size;$('spent').textContent=money(spent);$('balance').textContent=money(ca.opening+ca.addition-spent);let h=['No','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa','Remark','Aksi'];$('entryTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.vehicle),esc(e.load),esc(e.destination),money(e.cash),money(e.remaining),esc(e.remark),'<button onclick="editEntry('+e.id+')">✏️</button> <button class="danger" onclick="delEntry('+e.id+')">🗑️</button>']),h)||'Belum ada data';$('dashTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.destination),esc(e.load),money(e.cash)]),['No','Driver','Nopol','Tujuan','Muatan','Uang Saku'])||'Belum ada data';$('opening').value=ca.opening;$('addition').value=ca.addition;$('cashNote').value=ca.note||'';$('cashSummary').innerHTML='Saldo awal: <b>'+money(ca.opening)+'</b> · Tambahan: <b>'+money(ca.addition)+'</b> · Pengeluaran: <b>'+money(spent)+'</b> · Saldo akhir: <b>'+money(ca.opening+ca.addition-spent)+'</b>';$('historyTable').innerHTML=table(db.entries.map(e=>[e.date,e.project,'Muatan',e.driver,e.destination,e.load]).concat(db.cash.map(e=>[e.date,e.project,'Kas','Saldo awal',money(e.opening),money(e.addition)])),['Tanggal','Project','Jenis','Detail','Nilai 1','Nilai 2'])||'Belum ada riwayat'}$('date').value=new Date().toISOString().slice(0,10);renderProjects();clearForm();render();</script></body></html>
