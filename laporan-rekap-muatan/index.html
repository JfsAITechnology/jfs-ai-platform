<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Rekap Muatan & Uang Saku</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px Roboto,Arial}.top{background:#0b1220;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center}.top img,.projectbar img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px}.top small{display:block;color:#cbd5e1;margin-top:4px}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:14px;margin-bottom:12px}.projectbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:12px;margin-bottom:12px}.projectbar img{width:62px;height:62px}.projectbar .add{flex:0 1 430px}.form,.grid,.actions,.tabs{display:flex;gap:9px;flex-wrap:wrap}.field{flex:1;min-width:145px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#087cf5;color:white}.secondary{background:#e8eef7}.danger{background:#fee2e2;color:#b42318}.tab{background:#fff;border:1px solid #d9e0ea}.active{background:#087cf5;color:#fff}.stat{flex:1;min-width:130px}.num{font-size:24px;font-weight:900;margin-top:5px}.hide{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:8px;border:1px solid #d7dee8;text-align:left;font-size:12px;white-space:nowrap}th{background:#f1f5f9}@media(max-width:500px){.field{min-width:100%}.projectbar{align-items:flex-start}.projectbar img{width:52px;height:52px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import {requireAccess} from '../rekap-auth.js';requireAccess().then(ok=>{if(ok)document.body.classList.add('ready')}).catch(()=>location.href='../rekap-login.html');</script><style>body{visibility:hidden}body.ready{visibility:visible}</style></head><body><header class="top"><img src="assets/jfs-ai-robot.png.png.png" alt="Robot JFS AI Technology"><div><b>JFS AI Technology</b><small>Rekap Muatan Logistik & Uang Saku Driver</small></div></header><main class="wrap"><div class="projectbar"><div class="add"><b>Tambah Project / Vendor</b><div class="form" style="margin-top:7px"><input id="newProject" placeholder="Nama PT/Vendor" style="flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:8px"><button class="primary" onclick="addProject()">+ Project</button></div></div><img src="assets/jfs-ai-robot.png.png.png" alt="Robot JFS AI Technology"></div><div class="card"><div class="form"><div class="field"><label>Project / Vendor Aktif</label><select id="project" onchange="switchProject()"></select></div><div class="field"><label>Tanggal</label><input id="date" type="date" onchange="render()"></div></div><b>Hari: <span id="day">-</span></b></div><div class="tabs"><button class="tab active" onclick="page('dash',this)">Dashboard</button><button class="tab" onclick="page('entry',this)">Input Muatan</button><button class="tab" onclick="page('cash',this)">Uang Saku</button><button class="tab" onclick="page('history',this)">Riwayat & Export</button></div><section id="dash"><div class="grid"><div class="card stat">Total Muatan<div class="num" id="kg">0</div></div><div class="card stat">Jumlah Driver<div class="num" id="drivers">0</div></div><div class="card stat">Uang Saku<div class="num" id="spent">Rp0</div></div><div class="card stat">Saldo Tersisa<div class="num" id="balance">Rp0</div></div></div><div class="card"><h3>Rekap Hari Ini</h3><div id="dashTable" class="scroll"></div></div></section><section id="entry" class="hide"><div class="card"><h3 id="formTitle">Tambah Data Driver</h3><div class="form"><div class="field"><label>No Urut</label><input id="no" readonly></div><div class="field"><label>Driver</label><input id="driver"></div><div class="field"><label>Nopol</label><input id="nopol"></div><div class="field"><label>Jenis Mobil</label><input id="vehicle"></div><div class="field"><label>Ton/CBM/Rit</label><input id="load"></div><div class="field"><label>Tujuan</label><input id="destination"></div><div class="field"><label>Uang Saku — input manual</label><input id="entryCash" type="number" min="0" value="0"></div><div class="field"><label>Sisa Uang Saku — input manual</label><input id="remaining" type="number" min="0" value="0"></div><div class="field"><label>Remark</label><input id="remark"></div></div><div class="actions"><button class="primary" onclick="saveEntry()">Simpan</button><button class="secondary" onclick="clearForm()">Bersihkan</button></div></div><div class="card"><h3>Data Muatan</h3><div id="entryTable" class="scroll"></div></div></section><section id="cash" class="hide"><div class="card"><h3>Saldo & Tambahan Uang Saku</h3><div class="form"><div class="field"><label>Saldo Awal</label><input id="opening" type="number" min="0"></div><div class="field"><label>Tambahan</label><input id="addition" type="number" min="0"></div><div class="field"><label>Keterangan</label><input id="cashNote"></div><button class="primary" onclick="saveCash()">Simpan Kas</button></div><p id="cashSummary"></p></div></section><section id="history" class="hide"><div class="card"><h3>Riwayat & Export</h3><div class="actions"><button class="primary" onclick="exportPDF()">📄 Export PDF</button><button class="primary" onclick="exportExcel()">📊 Export Excel</button></div><p style="font-size:12px;color:#64748b">Export menggunakan Project dan tanggal aktif.</p><div id="historyTable" class="scroll"></div></div></section></main><script>
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co';
const SUPABASE_KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'jfs-rekap-auth'}});
const LOGO_SRC='assets/jfs-ai-robot.png.png.png';
let logoDataURL=null;
let user=null,projects=[],entries=[],cashRows=[],editId=null;

function money(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return {projectId:$('project').value,date:$('date').value}}
function activeProject(){return projects.find(p=>p.id===current().projectId)}
function rows(){const c=current();return entries.filter(e=>e.project_id===c.projectId&&e.entry_date===c.date)}
function nextNo(){return rows().reduce((m,e)=>Math.max(m,Number(e.no)||0),0)+1}
function table(data,heads){return data.length?'<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'Belum ada data'}
function longDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'-'}
function report(){return rows().map(e=>({No:e.no,Driver:e.driver,Nopol:e.nopol,'Jenis Mobil':e.vehicle,'Ton/CBM/Rit':e.load,Tujuan:e.destination,'Uang Saku':e.cash,'Sisa Uang Saku':e.remaining,Remark:e.remark}))}
function cashSummary(){const c=current(),es=rows(),ca=cashRows.find(x=>x.project_id===c.projectId&&x.entry_date===c.date)||{};const spent=es.reduce((a,e)=>a+Number(e.cash||0),0);return {addition:Number(ca.addition)||0,balance:(Number(ca.opening)||0)+(Number(ca.addition)||0)-spent}}

async function dbError(promise){const r=await promise;if(r.error)throw r.error;return r.data}
async function loadProjects(){
  projects=await dbError(sb.from('rekap_projects').select('id,name,created_at').order('created_at'));
  if(!projects.length){
    const s=await sb.from('rekap_projects').insert({user_id:user.id,name:'Umum'}).select('id,name,created_at').single();
    if(s.error)throw s.error;
    projects=[s.data];
  }
  renderProjects();
}
function renderProjects(){const old=$('project').value;$('project').innerHTML=projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');if(projects.some(p=>p.id===old))$('project').value=old}
async function addProject(){
  const name=$('newProject').value.trim();if(!name)return alert('Isi nama project');
  const r=await sb.from('rekap_projects').insert({user_id:user.id,name}).select('id,name,created_at').single();
  if(r.error)return alert('Gagal menambah project: '+r.error.message);
  projects.push(r.data);$('newProject').value='';renderProjects();$('project').value=r.data.id;clearForm();await render();
}
async function switchProject(){clearForm();await render()}
async function page(id,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');await render()}
function clearForm(){editId=null;$('formTitle').textContent='Tambah Data Driver';['driver','nopol','vehicle','load','destination','remark'].forEach(x=>$(x).value='');$('entryCash').value=0;$('remaining').value=0;$('no').value=nextNo()}
async function loadDay(){
  const c=current();if(!c.projectId||!c.date){entries=[];cashRows=[];return}
  const e=await sb.from('rekap_entries').select('*').eq('project_id',c.projectId).eq('entry_date',c.date).order('no');
  if(e.error)throw e.error;entries=e.data||[];
  const k=await sb.from('rekap_cash').select('*').eq('project_id',c.projectId).eq('entry_date',c.date).maybeSingle();
  if(k.error)throw k.error;cashRows=k.data?[k.data]:[];
}
async function saveEntry(){
  if(!$('driver').value.trim())return alert('Nama driver wajib diisi');
  const c=current(),payload={user_id:user.id,project_id:c.projectId,entry_date:c.date,no:editId?Number($('no').value):nextNo(),driver:$('driver').value.trim(),nopol:$('nopol').value.trim(),vehicle:$('vehicle').value.trim(),load:$('load').value.trim(),destination:$('destination').value.trim(),cash:Number($('entryCash').value)||0,remaining:Number($('remaining').value)||0,remark:$('remark').value.trim(),updated_at:new Date().toISOString()};
  let r=editId?await sb.from('rekap_entries').update(payload).eq('id',editId).eq('user_id',user.id):await sb.from('rekap_entries').insert(payload);
  if(r.error)return alert('Gagal menyimpan data: '+r.error.message);
  clearForm();await render();
}
async function editEntry(id){const e=entries.find(x=>x.id===id);if(!e)return;editId=id;$('formTitle').textContent='Edit Data Driver';['no','driver','nopol','vehicle','load','destination','entryCash','remaining','remark'].forEach((k,i)=>$(k).value=[e.no,e.driver,e.nopol,e.vehicle,e.load,e.destination,e.cash,e.remaining,e.remark][i]);await page('entry',document.querySelectorAll('.tab')[1])}
async function delEntry(id){if(!confirm('Hapus data ini?'))return;const r=await sb.from('rekap_entries').delete().eq('id',id).eq('user_id',user.id);if(r.error)return alert('Gagal menghapus: '+r.error.message);await render()}
async function saveCash(){
  const c=current(),payload={user_id:user.id,project_id:c.projectId,entry_date:c.date,opening:Number($('opening').value)||0,addition:Number($('addition').value)||0,note:$('cashNote').value.trim(),updated_at:new Date().toISOString()};
  const r=await sb.from('rekap_cash').upsert(payload,{onConflict:'user_id,project_id,entry_date'}).select().single();
  if(r.error)return alert('Gagal menyimpan kas: '+r.error.message);await render();alert('Kas tersimpan')
}
async function loadLogoDataURL(){
  if(logoDataURL)return logoDataURL;
  const res=await fetch(LOGO_SRC,{cache:'no-store'});
  if(!res.ok)throw new Error('Logo JFS AI gagal dimuat ('+res.status+')');
  const blob=await res.blob();
  logoDataURL=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('Logo gagal dikonversi'));fr.readAsDataURL(blob)});
  return logoDataURL;
}
async function exportPDF(){
  const r=report();if(!r.length)return alert('Belum ada data untuk Project dan tanggal aktif.');if(!window.jspdf?.jsPDF)return alert('Library PDF belum siap. Refresh halaman.');
  try{const logo=await loadLogoDataURL(),{jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4'),s=cashSummary(),heads=['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark'],body=r.map(e=>[e.No,e.Driver,e.Nopol,e['Jenis Mobil'],e['Ton/CBM/Rit'],e.Tujuan,money(e['Uang Saku']),money(e['Sisa Uang Saku']),e.Remark]);
  doc.setTextColor(13,59,102);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('REKAP MUATAN & UANG SAKU DRIVER',148.5,14,{align:'center'});doc.addImage(logo,'PNG',136.5,18,24,29);doc.setTextColor(153,153,153);doc.setFont('helvetica','italic');doc.setFontSize(8);doc.text('powered by : JFS AI Technology',148.5,51,{align:'center'});doc.setDrawColor(21,101,192);doc.line(14,57,283,57);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(80,80,80);doc.text('Tanggal',14,65);doc.text('Project / Vendor',14,74);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(13,59,102);doc.text(longDate(current().date),14,70);doc.text(activeProject()?.name||'',14,79);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(153,153,153);doc.text('Sisa Uang Hari Ini',283,65,{align:'right'});doc.text('Tambahan Uang Saku Hari Ini',283,74,{align:'right'});doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(13,59,102);doc.text(money(s.balance),283,70,{align:'right'});doc.setFontSize(10);doc.text(money(s.addition),283,79,{align:'right'});if(typeof doc.autoTable!=='function')return alert('Modul tabel PDF belum termuat. Refresh halaman.');doc.autoTable({startY:85,head:[heads],body,theme:'grid',margin:{left:14,right:14},styles:{fontSize:8.5,cellPadding:2,lineColor:[153,153,153],lineWidth:.15},headStyles:{fillColor:[21,101,192],textColor:[255,255,255],fontStyle:'bold',halign:'center'},columnStyles:{0:{halign:'center'},4:{halign:'center'},6:{halign:'right'},7:{halign:'right'}},didDrawPage:()=>{doc.setFontSize(7);doc.setTextColor(153,153,153);doc.text('powered by : JFS AI Technology  |  Halaman '+doc.internal.getNumberOfPages(),148.5,204,{align:'center'})}});doc.save('rekap-muatan-'+current().date+'.pdf')
  }catch(e){alert('Export PDF gagal: '+e.message)}
}
async function exportExcel(){
  const r=report();if(!r.length)return alert('Belum ada data untuk Project dan tanggal aktif.');if(!window.ExcelJS)return alert('Library Excel belum siap. Refresh halaman.');
  try{const logo=await loadLogoDataURL(),s=cashSummary(),heads=['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark'],wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Rekap Muatan'),logoId=wb.addImage({base64:logo,extension:'png'});
  ws.mergeCells('A1:B4');ws.mergeCells('C1:I1');ws.mergeCells('C2:I2');ws.addRow(['','','REKAP MUATAN & UANG SAKU DRIVER']);ws.addRow(['','','powered by : JFS AI Technology']);ws.addRow([]);ws.addRow([]);ws.addRow(['Tanggal',longDate(current().date),'','','','','Sisa Uang Hari Ini',money(s.balance),'']);ws.addRow(['Project / Vendor',activeProject()?.name||'','','','','','Tambahan Uang Saku',money(s.addition),'']);ws.addRow([]);ws.addRow(heads);r.forEach(e=>ws.addRow([e.No,e.Driver,e.Nopol,e['Jenis Mobil'],e['Ton/CBM/Rit'],e.Tujuan,Number(e['Uang Saku'])||0,Number(e['Sisa Uang Saku'])||0,e.Remark]));ws.addImage(logoId,{tl:{col:0,row:0},ext:{width:110,height:133}});ws.columns=[{width:6},{width:18},{width:16},{width:16},{width:14},{width:18},{width:15},{width:16},{width:24}];for(let i=1;i<=4;i++)ws.getRow(i).height=25;ws.getRow(1).height=34;ws.getRow(2).height=22;ws.getRow(8).font={bold:true,color:{argb:'FFFFFFFF'}};ws.getRow(8).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1565C0'}};ws.getRow(8).alignment={horizontal:'center',vertical:'middle'};for(let row=9;row<9+r.length;row++){for(let col=1;col<=9;col++){const cell=ws.getCell(row,col);cell.border={top:{style:'thin',color:{argb:'FF999999'}},bottom:{style:'thin',color:{argb:'FF999999'}},left:{style:'thin',color:{argb:'FF999999'}},right:{style:'thin',color:{argb:'FF999999'}}};cell.alignment={vertical:'middle',wrapText:true};if(col===7||col===8){cell.numFmt='"Rp " #,##0';cell.alignment={horizontal:'right',vertical:'middle'}}}}ws.getRow(5).font={bold:true,color:{argb:'FF0D3B66'}};ws.getRow(6).font={bold:true,color:{argb:'FF0D3B66'}};ws.freezePanes={ySplit:8};ws.autoFilter={from:{row:8,column:1},to:{row:8+r.length,column:9}};ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};ws.headerFooter.oddFooter.center.text='powered by : JFS AI Technology';const buffer=await wb.xlsx.writeBuffer(),blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rekap-muatan-'+current().date+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
  }catch(e){alert('Export Excel gagal: '+e.message)}
}
async function render(){
  try{await loadDay();const c=current(),es=rows(),ca=cashRows[0]||{opening:0,addition:0};$('day').textContent=c.date?new Date(c.date+'T12:00:00').toLocaleDateString('id-ID',{weekday:'long'}):'-';$('kg').textContent=es.reduce((a,e)=>a+(parseFloat(e.load)||0),0).toLocaleString('id-ID');$('drivers').textContent=new Set(es.map(e=>e.driver)).size;$('spent').textContent=money(es.reduce((a,e)=>a+Number(e.cash||0),0));$('balance').textContent=money(Number(ca.opening||0)+Number(ca.addition||0)-es.reduce((a,e)=>a+Number(e.cash||0),0));
  $('entryTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.vehicle),esc(e.load),esc(e.destination),money(e.cash),money(e.remaining),esc(e.remark),'<button onclick="editEntry(\''+e.id+'\')">✏️</button> <button class="danger" onclick="delEntry(\''+e.id+'\')">🗑️</button>']),['No Urut','Driver','Nopol','Jenis Mobil','Ton/CBM/Rit','Tujuan','Uang Saku','Sisa Uang Saku','Remark','Aksi']);
  $('dashTable').innerHTML=table(es.map(e=>[e.no,esc(e.driver),esc(e.nopol),esc(e.destination),esc(e.load),money(e.cash)]),['No','Driver','Nopol','Tujuan','Muatan','Uang Saku']);$('opening').value=ca.opening||0;$('addition').value=ca.addition||0;$('cashNote').value=ca.note||'';$('cashSummary').innerHTML='Saldo awal: <b>'+money(ca.opening)+'</b> · Tambahan: <b>'+money(ca.addition)+'</b> · Pengeluaran: <b>'+money(es.reduce((a,e)=>a+Number(e.cash||0),0))+'</b> · Saldo akhir: <b>'+money(Number(ca.opening||0)+Number(ca.addition||0)-es.reduce((a,e)=>a+Number(e.cash||0),0))+'</b>';
  const allE=await dbError(sb.from('rekap_entries').select('entry_date,project_id,driver,destination,load').order('entry_date',{ascending:false}).limit(500));const allK=await dbError(sb.from('rekap_cash').select('entry_date,project_id,opening,addition').order('entry_date',{ascending:false}).limit(500));const names=new Map(projects.map(p=>[p.id,p.name]));$('historyTable').innerHTML=table(allE.map(e=>[e.entry_date,names.get(e.project_id)||'-','Muatan',esc(e.driver),esc(e.destination),esc(e.load)]).concat(allK.map(e=>[e.entry_date,names.get(e.project_id)||'-','Kas','Saldo awal',money(e.opening),money(e.addition)])),['Tanggal','Project','Jenis','Detail','Nilai 1','Nilai 2'])||'Belum ada riwayat';
  }catch(e){console.error(e);alert('Gagal memuat data Rekap Muatan: '+e.message)}
}
async function boot(){
  const s=await sb.auth.getSession();user=s.data.session?.user;if(!user){location.href='../rekap-login.html';return}
  await loadProjects();if(!$('date').value)$('date').value=new Date().toISOString().slice(0,10);clearForm();await render()
}
$('date').value=new Date().toISOString().slice(0,10);boot();
</script></body></html>
