<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — Rekap Muatan Logistik</title><style>:root{font-family:system-ui;color:#142033;background:#f5f7fb}body{margin:0}header{background:#0b1220;color:white;padding:14px;display:flex;gap:10px;align-items:center;position:sticky;top:0}header img{width:40px;height:40px;background:white;border-radius:9px}.wrap{max-width:1000px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab,button{border:0;border-radius:9px;padding:10px 13px;font-weight:700}.tab{background:white;border:1px solid #ddd}.on,.primary{background:#087cf5;color:white}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:23px;font-weight:800;margin-top:4px}.muted{font-size:12px;color:#667085}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;box-sizing:border-box}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.scroll{overflow:auto}.hide{display:none}.danger{background:#fee2e2;color:#b91c1c}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:420px){.form{grid-template-columns:1fr}}</style><body><header><img src="https://raw.githubusercontent.com/JfsAITechnology/jfs-ai-platform/main/jfs-ai-logo.svg"><div><b>JFS AI Technology</b><div class="muted" style="color:#b8c2d3">Laporan Rekap Muatan Logistik & Uang Saku Driver</div></div></header><main class="wrap"><div class="tabs"><button class="tab on" onclick="page('d',this)">Dashboard</button><button class="tab" onclick="page('m',this)">Input Muatan</button><button class="tab" onclick="page('u',this)">Uang Saku</button><button class="tab" onclick="page('r',this)">Riwayat</button></div><section id="d"><div class="grid"><div class="card"><div class="muted">Total Muatan</div><div id="kgS" class="stat">0 kg</div></div><div class="card"><div class="muted">Perjalanan</div><div id="trS" class="stat">0</div></div><div class="card"><div class="muted">Uang Saku</div><div id="caS" class="stat">Rp0</div></div><div class="card"><div class="muted">Driver</div><div id="drS" class="stat">0</div></div></div><div class="card"><h3>Rekap Terbaru</h3><div id="dash" class="scroll"></div></div></section><section id="m" class="hide"><div class="card"><h3>Input Muatan</h3><div class="form"><div class="field"><label>Tanggal</label><input id="dt" type="date"></div><div class="field"><label>No. Perjalanan</label><input id="tp" placeholder="TRP-001"></div><div class="field"><label>Tujuan</label><input id="to" placeholder="Tujuan"></div><div class="field"><label>Muatan (kg)</label><input id="kg" type="number" min="0" step=".1"></div></div><p><button class="primary" onclick="addL()">Simpan Muatan</button></p></div></section><section id="u" class="hide"><div class="card"><h3>Uang Saku Driver</h3><div class="form"><div class="field"><label>Nama Driver</label><input id="dn"></div><div class="field"><label>No. Perjalanan</label><input id="ct"></div><div class="field"><label>Uang Saku</label><input id="cash" type="number" min="0"></div><div class="field"><label>Keterangan</label><input id="nt"></div></div><p><button class="primary" onclick="addC()">Simpan Uang Saku</button></p></div></section><section id="r" class="hide"><div class="card"><h3>Riwayat & Export</h3><p><button class="primary" onclick="pdf()">📄 PDF</button> <button class="primary" onclick="excel()">📊 Excel</button> <button class="danger" onclick="wipe()">Hapus Semua</button></p><div id="hist" class="scroll"></div></div></section></main><script>let L=JSON.parse(localStorage.jfsL||'[]'),C=JSON.parse(localStorage.jfsC||'[]');dt.value=new Date().toISOString().slice(0,10);const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function page(x,b){document.querySelectorAll('section').forEach(s=>s.classList.add('hide'));document.getElementById(x).classList.remove('hide');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));b.classList.add('on');render()}function save(){localStorage.jfsL=JSON.stringify(L);localStorage.jfsC=JSON.stringify(C);render()}function addL(){if(!tp.value||!to.value||!kg.value)return alert('Lengkapi data muatan.');L.push({date:dt.value,tp:tp.value,to:to.value,kg:+kg.value,id:Date.now()});tp.value=to.value=kg.value='';save()}function addC(){if(!dn.value||!ct.value||!cash.value)return alert('Lengkapi data uang saku.');C.push({date:dt.value, name:dn.value,tp:ct.value,cash:+cash.value,nt:nt.value,id:Date.now()});dn.value=ct.value=cash.value=nt.value='';save()}function render(){let k=L.reduce((a,x)=>a+x.kg,0),c=C.reduce((a,x)=>a+x.cash,0);kgS.textContent=k.toLocaleString('id-ID')+' kg';trS.textContent=new Set(L.map(x=>x.tp)).size;caS.textContent=rp(c);drS.textContent=new Set(C.map(x=>x.name)).size;let a=L.slice(-10).reverse();dash.innerHTML=a.length?'<table><tr><th>Tanggal</th><th>Perjalanan</th><th>Tujuan</th><th>Muatan</th></tr>'+a.map(x=>'<tr><td>'+x.date+'</td><td>'+x.tp+'</td><td>'+x.to+'</td><td>'+x.kg+' kg</td></tr>').join('')+'</table>':'Belum ada data';let all=[...L.map(x=>[x.date,'Muatan',x.tp,x.to,x.kg+' kg']),...C.map(x=>[x.date,'Uang Saku',x.tp,x.name+' — '+x.nt,rp(x.cash)])].sort((a,b)=>b[0].localeCompare(a[0]));hist.innerHTML=all.length?'<table><tr><th>Tanggal</th><th>Jenis</th><th>Perjalanan</th><th>Detail</th><th>Nilai</th></tr>'+all.map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join('')+'</table>':'Belum ada riwayat'}function pdf(){let w=open('','_blank');w.document.write('<html><body><h2>JFS AI Technology</h2><h3>Laporan Rekap Muatan Logistik & Uang Saku Driver</h3>'+hist.innerHTML+'</body></html>');w.print()}function excel(){let s='Tanggal,Jenis,Perjalanan,Detail,Nilai\\n';[...L.map(x=>[x.date,'Muatan',x.tp,x.to,x.kg+' kg']),...C.map(x=>[x.date,'Uang Saku',x.tp,x.name,x.cash])].forEach(r=>s+=r.map(v=>'"'+v+'"').join(',')+'\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='laporan-rekap-muatan.csv';a.click()}function wipe(){if(confirm('Hapus semua data?')){L=[];C=[];save()}}render()</script></body></html>
