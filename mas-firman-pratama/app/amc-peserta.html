<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Peserta AMC — Mas Firman Pratama</title><link rel="stylesheet" href="../styles/main.css"><style>.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.step{padding:12px;border:1px solid #dbe4ef;border-radius:10px;background:#f7f9fc}.step.on{background:#dff7e8;border-color:#9bd6ae}.step b{display:block}.muted2{color:#718096;font-size:13px}.warning{padding:12px;border-radius:10px;background:#fff8e6}.success{padding:12px;border-radius:10px;background:#e9f8ee}.contact{display:flex;gap:10px;flex-wrap:wrap}.contact a{display:inline-block;padding:11px 14px;border-radius:9px;background:#1f8f4d;color:#fff;text-decoration:none}</style></head><body><main class="main" style="margin-left:0"><div class="panel"><span class="tag">AMC PARTICIPANT PORTAL</span><h1>Portal Peserta AMC</h1><p class="muted">Cek status pendaftaran Anda tanpa masuk ke dashboard admin.</p><div class="row"><input id="phone" class="input" placeholder="Nomor WhatsApp peserta"><input id="code" class="input" placeholder="Kode Peserta" autocomplete="one-time-code"><button id="check" class="btn">🔎 Cek Status</button></div><p class="muted2">Kode Peserta diberikan saat pendaftaran/konfirmasi admin. Jangan bagikan kode ini kepada orang lain.</p><div id="result" style="margin-top:18px"></div></div></main><script>const API='https://evtkeyfjgqwarsmlzrkh.supabase.co/functions/v1/amc-public-portal';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const steps=['Daftar & Bayar','Formulir','Materi','Antrean 3–4 bulan','Kelas AMC'];function labelStatus(s){return String(s||'pending').replaceAll('_',' ')}async function load(){const phone=$('phone').value.trim(),code=$('code').value.trim(),out=$('result');if(!phone||!code)return out.innerHTML='<div class="warning">Nomor WhatsApp dan Kode Peserta wajib diisi.</div>';out.innerHTML='<div class="item">Memeriksa data…</div>';$('check').disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,portal_code:code})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Data tidak ditemukan');const p=d.participant,pay=d.payment,m=d.materials||[],s=d.schedule,cur=Math.max(1,Math.min(5,Number(p.current_step||1)));out.innerHTML='<div class="card"><h2>'+esc(p.full_name)+'</h2><p>Program: <b>'+esc(p.program_type)+'</b></p><div class="steps">'+steps.map((x,i)=>'<div class="step '+(i+1<=cur?'on':'')+'"><b>'+(i+1)+'</b>'+x+'</div>').join('')+'</div><div class="grid"><div class="card"><small>Status Pembayaran</small><h3>'+esc(labelStatus(pay?.status||p.payment_status))+'</h3>'+(pay?'<p>'+money(pay.amount)+(pay.paid_at?' · '+new Date(pay.paid_at).toLocaleDateString('id-ID'):'')+'</p>':'')+'</div><div class="card"><small>Status Materi</small><h3>'+esc(labelStatus(p.material_status))+'</h3><p>Materi AMC diberikan langsung oleh Pak Firman.</p></div><div class="card"><small>Status Antrean</small><h3>'+esc(labelStatus(p.queue_status))+'</h3><p>Estimasi umum 3–4 bulan.</p></div></div><hr><h3>📅 Jadwal Kelas</h3>'+(s?'<div class="success"><b>'+esc(s.title)+'</b><br>'+(s.schedule_date?new Date(s.schedule_date+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'Tanggal belum ditentukan')+' · '+(s.start_time||'09:00').slice(0,5)+'–'+(s.end_time||'15:00').slice(0,5)+' WIB<br>'+esc(s.location||'Pelaksanaan sesuai informasi dari Pak Firman')+'<br><small>Estimasi antrean: '+esc(s.queue_estimate||'3–4 bulan')+'</small></div>':'<div class="warning">Jadwal pribadi Anda belum ditetapkan. Pantau kembali portal ini atau hubungi Pak Firman.</div>')+'<hr><h3>📚 Materi AMC</h3><div class="warning">Materi tidak dibagikan melalui platform JFS AI. Materi diberikan langsung oleh Owner, Mas Firman Pratama.</div>'+(m.length?m.map(x=>'<div class="item"><b>'+esc(x.material_title)+'</b><br><small>Status: '+esc(x.status)+' · Channel: '+esc(x.delivery_channel||'Owner')+'</small></div>').join(''):'')+'<hr><h3>💬 Bantuan</h3><div class="contact"><a href="https://wa.me/6281333303010?text='+encodeURIComponent('Halo Pak Firman, saya ingin menanyakan status kelas AMC saya.')+'" target="_blank" rel="noopener">WhatsApp Pak Firman</a><a href="https://masfirmanpratama.com/" target="_blank" rel="noopener">Website Mas Firman</a></div></div>'}catch(e){out.innerHTML='<div class="warning">'+esc(e.message)+'</div>'}finally{$('check').disabled=false}}$('check').addEventListener('click',load);['phone','code'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')load()}));</script></body></html>
