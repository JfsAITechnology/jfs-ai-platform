<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMC — Portal Peserta</title><link rel="stylesheet" href="../styles/main.css"></head><body><main class="main" style="margin-left:0"><div class="panel"><span class="tag">AMC PARTICIPANT PORTAL</span><h1>Portal Peserta AMC</h1><p class="muted">Cek status pendaftaran, lengkapi data peserta, dan akses materi setelah pembayaran diverifikasi.</p><div class="row"><input id="phone" class="input" placeholder="Nomor WhatsApp"><button class="btn" onclick="loadParticipant()">🔎 Cek Status</button></div><div id="result" style="margin-top:18px"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../data/tenant.config.js"></script><script src="../services/supabase.js"></script><script src="../services/tenant.service.js"></script><script src="../scripts/auth.js"></script><script>
(async()=>{const access=await window.JFSTenantAuth?.requireTenantAccess();if(!access)return;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function sb(){return JFSTenantAuth.getSupabase()}window.loadParticipant=async()=>{const phone=$('phone').value.trim(),out=$('result');if(!phone)return out.innerHTML='<div class="item">Nomor WhatsApp wajib diisi.</div>';out.innerHTML='<div class="item">Memuat…</div>';try{const s=await sb();const r=await s.from('jfs_amc_participants').select('*').eq('tenant_id',JFSTenantAuth.tenantId).eq('phone',phone).order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(!r.data)return out.innerHTML='<div class="item">Peserta belum ditemukan.</div>';const p=r.data;const pay=await s.from('jfs_amc_payments').select('*').eq('participant_id',p.id).order('created_at',{ascending:false}).limit(1).maybeSingle();const mats=await s.from('jfs_amc_material_deliveries').select('*').eq('participant_id',p.id).order('created_at',{ascending:false});const steps=['Daftar & Bayar','Formulir','Materi','Antrean 3–4 bulan','Kelas 09.00–15.00'];const cur=Number(p.current_step||1);out.innerHTML=`<div class="card"><h2>${esc(p.full_name)}</h2><p>Program: <b>${esc(p.program_type)}</b> · Pembayaran: <b>${esc(pay.data?.status||p.payment_status||'pending')}</b></p><div>${steps.map((x,i)=>`<span style="display:inline-block;padding:7px;margin:3px;border-radius:8px;background:${i+1<=cur?'#dff7e8':'#f1f3f5'}">${i+1}. ${x}</span>`).join('')}</div><hr><h3>📋 Formulir Peserta</h3><div class="grid"><input id="n" class="input" value="${esc(p.full_name)}" placeholder="Nama"><input id="e" class="input" value="${esc(p.email||'')}" placeholder="Email"><input id="c" class="input" value="${esc(p.city||'')}" placeholder="Kota"><input id="a" class="input" value="${esc(p.address||'')}" placeholder="Alamat"><input id="b" type="date" class="input" value="${esc(p.birth_date||'')}"><input id="o" class="input" value="${esc(p.occupation||'')}" placeholder="Pekerjaan"></div><button class="btn" onclick="save('${p.id}')">💾 Simpan Formulir</button><hr><h3>📚 Materi Peserta</h3>${mats.data?.length?mats.data.map(m=>`<div class="item"><b>${esc(m.material_title)}</b> · ${esc(m.status)}${m.material_url?`<br><a class="btn" href="${esc(m.material_url)}" target="_blank" rel="noopener">Buka Materi</a>`:''}</div>`).join(''):'<div class="item">Materi akan muncul setelah pembayaran diverifikasi dan materi dikirim.</div>'}<hr><h3>💬 Bantuan Admin</h3><button class="btn" onclick="wa('${esc(p.phone)}')">WhatsApp Admin</button></div>`}catch(e){out.innerHTML='<div class="item">Gagal: '+esc(e.message)+'</div>'}};window.save=async id=>{const s=await sb();const{error}=await s.from('jfs_amc_participants').update({full_name:$('n').value.trim(),email:$('e').value.trim()||null,city:$('c').value.trim()||null,address:$('a').value.trim()||null,birth_date:$('b').value||null,occupation:$('o').value.trim()||null,registration_status:'form_completed',current_step:3,updated_at:new Date().toISOString()}).eq('id',id).eq('tenant_id',JFSTenantAuth.tenantId);if(error)return alert(error.message);await s.from('jfs_analytics_events').insert({tenant_id:JFSTenantAuth.tenantId,event_type:'participant_form_completed',channel:'participant_portal',metadata:{participant_id:id}});loadParticipant()};window.wa=phone=>{let p=String(phone).replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Halo Admin Mas Firman, saya ingin menanyakan status AMC saya.'),'_blank','noopener')};})();
</script></body></html>
