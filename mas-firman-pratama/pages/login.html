import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co',KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD',TENANT_ID='f0098e1c-da0c-4411-8720-9c99a3cfb115',STORAGE_KEY='jfs-ai-auth';const supabase=createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:STORAGE_KEY}});const form=document.getElementById('loginForm'),submit=document.getElementById('submit'),error=document.getElementById('error'),diag=document.getElementById('diag');const params=new URLSearchParams(location.search),next=params.get('next'),target=next&&next.startsWith(location.origin)?next:'../app/dashboard.html';function showDiag(x){diag.style.display='block';diag.textContent=JSON.stringify(x,null,2)}async function diagnostic(){const out={time:new Date().toISOString(),origin:location.origin,pathname:location.pathname,storageKey:STORAGE_KEY,tenantId:TENANT_ID,redirectTarget:target,auth:{}};try{const s=await supabase.auth.getSession();out.auth.sessionExists=!!s.data?.session;out.auth.userId=s.data?.session?.user?.id||null;out.auth.jwtEmail=s.data?.session?.user?.email||null;out.auth.accessToken=!!s.data?.session?.access_token;out.auth.sessionError=s.error?.message||null;const r=await supabase.rpc('jfs_check_tenant_membership',{p_tenant_id:TENANT_ID});out.rpc={error:r.error?.message||null,code:r.error?.code||null,status:r.error?.status||null,data:r.data};out.membership=Array.isArray(r.data)?r.data[0]||null:r.data||null}catch(e){out.exception={message:e?.message||String(e),name:e?.name||null}}showDiag(out);return out}async function waitForSession(){for(let i=0;i<20;i++){const{data}=await supabase.auth.getSession();if(data?.session?.access_token)return data.session;await new Promise(r=>setTimeout(r,300))}return null}async function check(){const s=await waitForSession();if(!s)throw new Error('NO_SESSION');const{data,error:e}=await supabase.rpc('jfs_check_tenant_membership',{p_tenant_id:TENANT_ID});if(e)throw e;const m=Array.isArray(data)?data[0]||null:data||null;return{session:s,membership:m}}async function route(){try{const r=await check();if(r.membership)location.replace(target)}catch(e){console.debug('precheck',e)}}route();form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';diag.style.display='none';submit.disabled=true;submit.textContent='Memeriksa...';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{data,error:le}=await supabase.auth.signInWithPassword({email,password});if(le)throw new Error('INVALID_LOGIN');const s=await waitForSession();if(!s||s.user.id!==data?.user?.id)throw new Error('NO_SESSION');const r=await check();if(!r.membership){error.textContent='Login berhasil, tetapi membership tenant belum terdeteksi.';await diagnostic();throw new Error('NO_TENANT')}submit.textContent='Membuka dashboard...';location.replace(target)}catch(e){console.error(e);if(e.message==='INVALID_LOGIN')error.textContent='Email atau password tidak valid.';else if(e.message!=='NO_TENANT')error.textContent='Login berhasil, tetapi sesi belum siap.';submit.disabled=false;submit.textContent='Masuk ke Dashboard'}});supabase.auth.onAuthStateChange((event,session)=>{console.debug('AUTH_EVENT',event,!!session);if(event==='SIGNED_IN'&&session)setTimeout(route,500)});window.addEventListener('error',e=>console.error('RUNTIME_ERROR',e.error||e.message));
