te="current-password" required></div><div id="error" class="error"></div><button id="submit" class="btn" type="submit">Masuk ke Dashboard</button></form><div class="footer">JFS AI Technology • Secure tenant access</div></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const SUPABASE_URL='https://evtkeyfjgqwarsmlzrkh.supabase.co',KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD',TENANT_ID='f0098e1c-da0c-4411-8720-9c99a3cfb115';const supabase=createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'jfs-ai-auth'}});const form=document.getElementById('loginForm'),submit=document.getElementById('submit'),error=document.getElementById('error');const params=new URLSearchParams(location.search),next=params.get('next');const target=next&&next.startsWith(location.origin)?next:'../app/dashboard.html';async function waitForSession(){for(let i=0;i<15;i++){const{data}=await supabase.auth.getSession();if(data?.session?.access_token)return data.session;await new Promise(r=>setTimeout(r,300));}return null}async function membership(){const session=await waitForSession();if(!session)throw new Error('NO_SESSION');const{data,error:e}=await supabase.rpc('jfs_check_tenant_membership',{p_tenant_id:TENANT_ID});if(e)throw e;return{session,membership:Array.isArray(data)?data[0]||null:data||null}}async function routeIfAuthorized(){try{const r=await membership();if(r.membership)location.replace(target)}catch(e){console.debug('tenant precheck',e)}}routeIfAuthorized();form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='Memeriksa...';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{data,error:loginError}=await supabase.auth.signInWithPassword({email,password});if(loginError)throw new Error('INVALID_LOGIN');const session=await waitForSession();if(!session||session.user.id!==data?.user?.id)throw new Error('NO_SESSION');const r=await membership();if(!r.membership)throw new Error('NO_TENANT');submit.textContent='Membuka dashboard...';location.replace(target)}catch(e){console.error(e);if(e.message==='INVALID_LOGIN')error.textContent='Email atau password tidak valid.';else if(e.message==='NO_TENANT')error.textContent='Login berhasil, tetapi membership tenant belum terdeteksi. Silakan refresh dan coba lagi.';else error.textContent='Login berhasil, tetapi sesi belum siap. Silakan coba lagi.';submit.disabled=false;submit.textContent='Masuk ke Dashboard'}});supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user)setTimeout(()=>routeIfAuthorized(),250)});
</script></body></html>
