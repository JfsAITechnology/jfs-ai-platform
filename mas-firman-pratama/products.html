['Buku Instan Hipnosis','https://masfirmanpratama.com/wp-content/uploads/2024/11/H5.jpg',`Bentuk modul ini adalah modul cetak (buku), anda bisa membacanya sambil memahami dan langsung praktek. Materi adalah Hipnosis Modern. Membahas dengan contoh dan video dari bawah sadar. Membahas dengan jelas melalui gambar dari teknik membuka pikiran manusia. Menjelaskan tentang metode dalam Hipnotis panggung beserta trik dan rahasianya. Menjelaskan cara untuk mengetahui tipe orang yang mudah dihipnotis. Menjelaskan tentang metode Hipnosis dalam bernegoisasi atau berjualan. Menjelaskan tentang kalimat-kalimat yang mudah diterima oleh bawah sadar. Menjelaskan tentang aturan penting dalam membuat kalimat sugesti. Menjelaskan cara praktek menghipnotis dengan cepat, dilengkapi video. Menjelaskan menghipnotis tanpa suara dan tanpa kata-kata (stage extreme hipnotis).\n\nJika anda lancar berkomunikasi, maka dengan membaca modul pelatihan jarak jauh dari Wahana Sejati, dalam 1 hari sudah bisa menghipnotis. Modul pelatihan jarak jauh ini berbeda dengan semua buku yang beredar dipasaran. Letak perbedaannya: dari bagian awal langsung disertai contoh dan simulasi; isi modul merupakan perkataan trainer Firman Pratama dan Master Arifin ketika mengisi pelatihan langsung; bukan teori umum yang ada di buku pasaran dan internet; dibuat urut dan sistematis; langsung dicontohkan dalam video; praktek menghipnotis juga melalui bimbingan video; dan bahasa yang ditulis sangat sederhana serta mudah dipahami masyarakat awam. Buku ini dilengkapi Tutorial Step by Step membantu Anda belajar Hipnotis sampai bisa dengan MUDAH.`],
