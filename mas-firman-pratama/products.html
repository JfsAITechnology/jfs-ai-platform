['Buku 10 Keajaiban Pikiran','https://masfirmanpratama.com/wp-content/uploads/2024/11/10kc.jpg',`Buku 10 Keajaiban Pikiran ini diselesaikan dengan penuh keajaiban. Karena itu bersiaplah, menerima perubahan besar dalam diri anda. Merenungi kebenaran dari keajaiban pikiran. Saatnya anda menjadi pengatur kehidupan, pengatur pikiran. Menyadari bahwa anda pemilik pikiran itu sendiri, dan kesadaran ini langkah awal dalam mengenal Tuhan dengan sebenar benarnya.`],
['Kitab Kunci Penarik Rezeki','https://masfirmanpratama.com/wp-content/uploads/2024/11/kpr2-tnpa-web.jpg',`Kitab Kunci Penarik Rezeki adalah sebuah buku yang mengupas tuntas tentang Rezeki. Dimulai dengan menjelaskan tentang Takdir Rezeki sampai dengan bagaimana cara Praktik Menarik Rezeki yang benar dan mudah. Kitab Kunci Penarik Rezeki bermanfaat dalam meningkatkan kesuksesan dan kemakmuran hidup. Buku ini sangat cocok bagi siapa saja yang ingin meraih keberuntungan dan kesuksesan finansial dalam hidup. Anda dapat memperoleh berbagai manfaat yang luar biasa, termasuk meningkatkan kesejahteraan finansial, meraih kesuksesan dalam karir, dan meraih kebahagiaan hidup yang lebih utuh dan seimbang. Kitab Kunci Penarik Rezeki dijelaskan dengan cara yang mudah dipahami, sehingga siapa saja bisa mempelajarinya dan mengamalkannya dengan mudah. Buku ini juga dilengkapi dengan buku tugas harian, sehingga Anda bisa mempraktekkannya langsung.`],
['Buku Alpha Telepati','https://masfirmanpratama.com/wp-content/uploads/2024/11/ATc.jpg',`Buku Alpha Telepati adalah buku yang menjelaskan teknik untuk mempengaruhi orang lain tanpa bertemu. Cocok untuk diterapkan dalam:\n1. Menagih orang yang berhutang\n2. Membuat lawan jenis suka\n3. Membuat calon konsumen mudah deal dengan anda\n4. Memudahkan dalam bernegosiasi\n5. Mengembalikan pasangan yang pergi\n6. Memudahkan menasehati anak\n7. Mempengaruhi atasan/bos agar tunduk\n8. Membuat orang yang awalnya menolak cinta menjadi menerima\n9. Membuat bisnis menjadi laris\n10. Membuat diri menjadi lebih percaya diri.`],
['Buku Instan Hipnosis','https://masfirmanpratama.com/wp-content/uploads/2024/11/H5.jpg',`Bentuk modul ini adalah modul cetak (buku), anda bisa membacanya sambil memahami dan langsung praktek. Materinya adalah Hipnosis Modern. Membahas dengan contoh dan video dari bawah sadar, gambar teknik membuka pikiran manusia, metode Hipnotis panggung beserta trik dan rahasianya, cara mengetahui tipe orang yang mudah dihipnotis, metode Hipnosis dalam bernegosiasi atau berjualan, kalimat yang mudah diterima oleh bawah sadar, aturan penting dalam membuat kalimat sugesti, cara praktek menghipnotis dengan cepat yang dilengkapi video, serta menghipnotis tanpa suara dan tanpa kata-kata (stage extreme hipnotis).\n\nModul pelatihan jarak jauh dari Wahana Sejati disusun berbeda dari buku umum di pasaran: dari bagian awal langsung disertai contoh dan simulasi; berisi perkataan trainer Firman Pratama dan Master Arifin ketika mengisi pelatihan langsung; dibuat urut dan sistematis; dicontohkan dalam video; praktik melalui bimbingan video; dan menggunakan bahasa sederhana yang mudah dipahami masyarakat awam. Buku ini dilengkapi Tutorial Step by Step membantu Anda belajar Hipnotis sampai bisa dengan mudah.`],

['Kitab 101 Kalimat Sugesti Ajaib','https://masfirmanpratama.com/wp-content/uploads/2024/11/101-tanpa-web-2.jpg',`Kitab 101 Kalimat Sugesti Ajaib ini sudah bisa anda pesan untuk menjadi panduan untuk mensugesti pikiran agar bisa membuat hidup menjadi lebih nyaman lagi. Dalam kitab ini terdapat 101 kalimat sugesti yang langsung bisa anda terapkan dalam hidup:\n\n1. 10 sugesti ajaib bagi anda yang single/jomblo supaya cepat menemukan jodoh\n2. 10 sugesti ajaib bagi pelajar/mahasiswa agar sukses di pendidikannya\n3. 10 sugesti ajaib bagi para suami agar rumah tangganya bahagia dan berlimpah rejeki\n4. 10 sugesti ajaib bagi pasangan kekasih supaya awet menuju pernikahan yang bahagia\n5. 10 sugesti ajaib bagi Anda yang terjerat hutang supaya cepat lepas dari hutang\n6. 10 sugesti ajaib para istri agar rumah tangganya bahagia dan berlimpah rejeki\n7. 10 sugesti ajaib bagi para orang tua supaya bisa membentuk anak-anak yang sukses\n8. 10 sugesti ajaib bagi guru/dosen agar bisa membentuk muridnya menjadi baik\n9. 10 sugesti ajaib bagi anda yang memiliki bisnis agar bisnisnya cepat sukses\n10. 10 sugesti ajaib untuk semua orang yang ingin hidupnya sehat, kaya dan bahagia\n\nAda 3 Teknik Plus: teknik untuk membuat air minum menjadi ajaib, teknik untuk membuat jimat sendiri, dan teknik untuk mengunci mulut orang lain yang bawel.\n\nBonus audio sugesti dan audio terapi dalam bentuk flashdisk: sugesti untuk percaya diri, sugesti ketika sakit, sugesti saat malam hari, sugesti untuk memperbanyak uang, sugesti saat pagi hari, dan sugesti saat siang hari.`],
