<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI Assistant — Mas Firman</title><style>*{box-sizing:border-box}body{margin:0;background:#061022;color:#f4f7ff;font:13px Arial}.h{padding:12px;background:#0b1831;border-bottom:1px solid #ffffff15;display:flex;gap:9px;align-items:center}.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #12d7ff}.h b{display:block;font-size:12px}.h small{color:#7f8da8;font-size:9px}.chat{height:calc(100vh - 132px);overflow:auto;padding:12px}.m{max-width:90%;padding:10px 12px;background:#112142;border-radius:10px;margin:7px 0;font-size:11px;line-height:1.55}.u{margin-left:auto;background:#0868c9}.quick{display:flex;gap:5px;flex-wrap:wrap}.quick button{border:1px solid #12d7ff2b;background:#0b1830;color:#9beaff;border-radius:999px;padding:6px 8px;font-size:9px}.bar{position:fixed;left:0;right:0;bottom:0;padding:8px;background:#071225;border-top:1px solid #ffffff12;display:flex;gap:6px}.bar input{flex:1;min-width:0;background:#09152a;color:#fff;border:1px solid #ffffff18;border-radius:8px;padding:10px;font-size:10px}.bar button{background:#1687ff;color:#fff;border:0;border-radius:8px;padding:10px;font-size:10px}.cta{display:block;background:#1ebc68;color:#fff;text-decoration:none;text-align:center;padding:8px;border-radius:7px;margin-top:8px;font-size:9px}</style></head><body><div class="h"><img class="logo" src="logo.jpg"><div><b>🤖 JFS AI Assistant</b><small>Knowledge: Mas Firman Pratama</small></div></div><div class="chat" id="chat"><div class="m"><b>JFS AI:</b><br>Halo! Saya AI Assistant Mas Firman. Saya dapat membantu menjelaskan program AMC, buku/kitab, materi, profil dan pendaftaran berdasarkan knowledge website.</div><div class="quick"><button onclick="ask('Berapa harga AMC Reguler?')">Harga Reguler</button><button onclick="ask('Apa beda Reguler, Privat dan Platinum?')">Bandingkan AMC</button><button onclick="ask('Buku apa saja yang tersedia?')">Katalog Buku</button><button onclick="ask('Apa saja materi AMC?')">Materi AMC</button></div></div><div class="bar"><input id="q" placeholder="Tulis pertanyaan..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Kirim</button></div><script src="knowledge.js"></script><script>const K=window.FIRMAN_KNOWLEDGE;function add(t,c){let d=document.createElement('div');d.className='m '+(c||'');d.innerHTML=t;chat.appendChild(d);chat.scrollTop=999999}function ask(t){q.value=t;send()}function wa(t){return '<a class="cta" href="https://wa.me/'+K.contact.phone+'?text='+encodeURIComponent(t)+'" target="_blank">Lanjut ke WhatsApp Admin</a>'}function answer(v){let l=v.toLowerCase();if(l.includes('harga')||l.includes('biaya')||l.includes('investasi')){let p=K.programs.find(x=>l.includes(x.name.toLowerCase().replace('kelas amc ','')));if(p)return '<b>'+p.name+'</b>: <b>Rp '+p.price.toLocaleString('id-ID')+'</b>.<br>'+p.description+'<br><br>'+p.items.slice(0,5).join(' · ')+wa('Saya ingin daftar '+p.name);return 'Harga program AMC: Reguler Rp4.500.000, Platinum Rp22.500.000, Privat Rp7.500.000. Harga buku/kitab tidak tercantum pada katalog website, jadi saya sarankan konfirmasi ke admin untuk harga dan stok terbaru.'+wa('Saya ingin menanyakan harga buku/kitab')}if(l.includes('beda')||l.includes('banding'))return '<b>Reguler</b> Rp4.500.000 — kelas sesuai jadwal/antrian. <b>Privat</b> Rp7.500.000 — offline 1-on-1 dan dapat lebih spesifik. <b>Platinum</b> Rp22.500.000 — program intensif 3 hari 2 malam.'+wa('Saya ingin dibantu memilih program AMC')}if(l.includes('buku')||l.includes('kitab')||l.includes('produk'))return 'Katalog website memuat: <b>10 Keajaiban Pikiran</b>, <b>101 Kalimat Sugesti Ajaib</b>, <b>Alpha Telepati</b>, <b>Instan Hipnosis</b>, dan <b>Kitab Kunci Penarik Rezeki</b>. Harga terbaru perlu dikonfirmasi admin.'+wa('Saya ingin memesan/menanyakan buku atau kitab')}if(l.includes('materi')||l.includes('amc'))return 'Materi AMC mencakup pikiran bawah sadar, akses dan modifikasi program pikiran, Alpha-State, Alpha Telepati, doa, sahabat virtual, karyawan virtual, sensory perception, dan topik lain hingga 20 materi. Saya bisa membantu menjelaskan program yang cocok.'+wa('Saya ingin informasi lengkap materi AMC')}if(l.includes('profil')||l.includes('siapa')||l.includes('firman'))return '<b>'+K.profile.name+'</b><br>'+K.profile.title+'<br><br>'+K.profile.summary;if(l.includes('daftar')||l.includes('registrasi')||l.includes('kelas'))return 'Pendaftaran tersedia untuk AMC Reguler, Platinum dan Privat. Anda dapat langsung menghubungi admin melalui WhatsApp agar jadwal terbaru dan proses pendaftaran dapat dikonfirmasi.'+wa('Saya ingin mendaftar kelas AMC')}if(l.includes('admin')||l.includes('whatsapp')||l.includes('wa')||l.includes('hubungi'))return 'Admin Mas Firman: <b>081.2306.33.464</b>.'+wa('Halo Admin, saya ingin informasi program dan produk')}if(l.includes('bisnis')||l.includes('hutang')||l.includes('jabatan')||l.includes('stagnan')||l.includes('anak')||l.includes('pasangan'))return 'Website Mas Firman membahas kebutuhan seperti bisnis terasa lesu, hutang menumpuk, sulit naik jabatan, hidup stagnan, anak susah menurut dan masalah pasangan. Jelaskan kebutuhan Anda agar saya dapat mengarahkan ke informasi AMC yang relevan.';return 'Saya bisa membantu tentang <b>harga program AMC</b>, <b>perbedaan kelas</b>, <b>produk buku/kitab</b>, <b>20 materi AMC</b>, <b>profil Mas Firman</b>, dan <b>pendaftaran</b>. Coba tanyakan: “Berapa harga AMC Privat?”'}function send(){let v=q.value.trim();if(!v)return;add(v.replace(/[<>]/g,''),'u');q.value='';setTimeout(()=>add(answer(v)),160)}</script></body></html>
