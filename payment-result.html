<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Pembayaran — JFS AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101f;color:#f4f7ff;font:15px Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(620px,92%);background:#0d1931;border:1px solid #263852;border-radius:20px;padding:30px;box-shadow:0 25px 70px #0005}h1{margin:0 0 12px;font-size:28px}.muted{color:#91a0bd;line-height:1.7}.status{padding:16px;border-radius:12px;background:#101e37;margin:20px 0;white-space:pre-wrap}.paid{background:#103526;color:#bbf7d0}.fail{background:#3b1722;color:#fecdd3}.btn{display:inline-block;text-decoration:none;padding:12px 16px;border-radius:10px;background:#0879ff;color:#fff;font-weight:700;margin:8px 8px 0 0}.secondary{background:#15243d;border:1px solid #334764}</style></head><body><main class="card"><div style="color:#12d7ff;font-weight:800;letter-spacing:1px;font-size:12px">JFS AI TECHNOLOGY</div><h1>Status pembayaran</h1><p class="muted">Status akan diperbarui setelah sistem menerima dan memverifikasi notifikasi dari Midtrans. Jangan mengirim bukti transfer sebagai pengganti verifikasi otomatis.</p><div id="status" class="status">Memeriksa pesanan…</div><div id="details" class="muted"></div><a class="btn" href="./customer.html">Kembali ke produk</a><a class="btn secondary" href="./checkout.html">Lihat paket</a></main><script>
const URL="https://evtkeyfjgqwarsmlzrkh.supabase.co",KEY="sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD";
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"jfs-ai-platform-auth"}});
const orderId=new URLSearchParams(location.search).get("order_id");const statusEl=document.getElementById("status"),details=document.getElementById("details");let tries=0;
async function check(){tries++;try{const {data:{session}}=await db.auth.getSession();if(!session){statusEl.textContent="Silakan login kembali ke JFS AI untuk melihat status pesanan.";return}if(!orderId){statusEl.textContent="Nomor pesanan tidak ditemukan pada URL.";statusEl.className="status fail";return}const {data,error}=await db.from("jfs_midtrans_payment_orders").select("order_id,app_code,plan_name,amount,status,paid_at,created_at").eq("order_id",orderId).maybeSingle();if(error)throw error;if(!data){statusEl.textContent="Pesanan tidak ditemukan atau Anda tidak memiliki akses.";statusEl.className="status fail";return}details.textContent="Nomor pesanan: "+data.order_id+" · Produk: "+data.app_code+" · Paket: "+data.plan_name+" · Total: Rp"+Number(data.amount).toLocaleString("id-ID");if(data.status==="PAID"){statusEl.className="status paid";statusEl.textContent="PEMBAYARAN BERHASIL\nPembayaran sudah diverifikasi oleh server. Aktivasi subscription tercatat pada akun Anda.";return}if(["FAILED","EXPIRED","CANCELLED"].includes(data.status)){statusEl.className="status fail";statusEl.textContent="Pembayaran belum berhasil ("+data.status+"). Anda dapat kembali ke halaman paket untuk mencoba lagi.";return}statusEl.className="status";statusEl.textContent="MENUNGGU KONFIRMASI\nPesanan sudah tercatat, tetapi pembayaran belum terverifikasi. Halaman memeriksa ulang status secara otomatis.";if(tries<15)setTimeout(check,4000)}catch(e){statusEl.className="status fail";statusEl.textContent="Tidak dapat memuat status: "+e.message}}
check();
</script></body></html>
