<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFS AI — WhatsApp Bekerja Lebih Pintar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070f;
    --panel: #0f1642;
    --panel-line: #24305f;
    --text: #f4f6ff;
    --muted: #98a3c4;
    --blue: #4c8dff;
    --green: #29d67a;
    --orange: #ef7f2e;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 50% 0%, #0d1330 0%, #05070f 55%, #030410 100%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo{
    width: 64px; height: 64px;
    margin-bottom: 22px;
    filter: drop-shadow(0 0 18px rgba(76,141,255,.35));
  }
  h1{
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.18;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  h1 span{ color: var(--blue); }
  p.lede{
    color: var(--muted);
    font-size: 16px;
    line-height: 1.55;
    max-width: 38ch;
    margin: 0 0 30px;
  }
  .video-shell{
    position: relative;
    width: 100%;
    max-width: 340px;
    border-radius: 26px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 70px -20px rgba(0,60,200,.45), 0 0 0 1px var(--panel-line);
  }
  video{
    display:block;
    width: 100%;
    height: auto;
  }
  /* real clickable button that appears synced to the on-screen CTA near the end of the video */
  .in-video-cta{
    position: absolute;
    left: 50%;
    bottom: 17%;
    transform: translate(-50%, 8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease, transform .45s ease;
    text-decoration: none;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 13px 22px;
    border-radius: 30px;
    background: var(--orange);
    white-space: nowrap;
  }
  .in-video-cta.show{
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .cta{
    margin-top: 30px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .btn-primary{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--orange), #ff9d4d);
    box-shadow: 0 14px 30px -10px rgba(239,127,46,.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 18px 34px -10px rgba(239,127,46,.7); }
  .btn-primary:active{ transform: translateY(0); }
  .btn-primary svg{ width: 18px; height: 18px; flex-shrink: 0; }

  .hint{
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .footer{
    margin-top: 44px;
    color: #5b6690;
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce){
    .in-video-cta{ transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="jfs-logo.png" alt="JFS AI Technology">
    <h1>WhatsApp Anda,<br>Kini Dijawab <span>AI</span></h1>
    <p class="lede">Lihat bagaimana JFS AI membantu WhatsApp bisnis Anda menjawab pelanggan lebih cepat — otomatis, 24 jam.</p>

    <div class="video-shell">
      <video id="promoVideo" src="jfs-ai-whatsapp-automation.mp4" playsinline muted autoplay loop controls></video>
      <a id="inVideoCta" class="in-video-cta" href="https://jfsaitechnology.github.io/jfs-ai-platform/ai-customer-service.html" target="_blank" rel="noopener">Pelajari JFS AI →</a>
    </div>

    <div class="cta">
      <a class="btn-primary" href="https://jfsaitechnology.github.io/jfs-ai-platform/ai-customer-service.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.06-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Zm0 18c-1.63 0-3.15-.44-4.46-1.21l-.32-.19-3.01.79.8-2.94-.21-.31A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8Zm4.34-5.98c-.24-.12-1.4-.69-1.62-.77-.22-.08-.38-.12-.54.12-.16.24-.62.77-.76.93-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.39-.4-.54-.4-.14 0-.3-.02-.46-.02s-.42.06-.64.3c-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.4-.57 1.6-1.12.2-.55.2-1.02.14-1.12-.06-.1-.22-.16-.46-.28Z"/></svg>
        Chat dengan JFS AI di WhatsApp
      </a>
      <p class="hint">Demo gratis, tanpa perlu login.</p>
    </div>

    <p class="footer">JFS AI Technology</p>
  </div>

<script>
  const video = document.getElementById('promoVideo');
  const overlayCta = document.getElementById('inVideoCta');
  video.addEventListener('timeupdate', () => {
    const t = video.currentTime;
    if (t >= 30 && t <= video.duration - 0.15) {
      overlayCta.classList.add('show');
    } else {
      overlayCta.classList.remove('show');
    }
  });
  video.addEventListener('pause', () => {
    if (video.currentTime >= 30) overlayCta.classList.add('show');
  });
</script>
</body>
</html>
