<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Rekap Muatan JFS AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d1117;color:#fff;font:15px Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,92%);background:#151a22;border:1px solid #273142;border-radius:22px;padding:25px;position:relative;overflow:hidden}.login-head{display:flex;align-items:center;gap:16px}.jfs-logo{width:78px;height:78px;object-fit:contain;flex:0 0 auto}.vehicle{margin-left:auto;width:150px;height:92px;display:grid;place-items:center;font-size:68px;filter:drop-shadow(0 8px 18px #2563eb55);animation:float 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.powered{margin:5px 0 18px;color:#94a3b8;font-size:10px;letter-spacing:.05em}.title{margin:0;font-size:25px}.sub{margin:6px 0 0;color:#94a3b8;font-size:12px}input{width:100%;box-sizing:border-box;margin:7px 0 12px;padding:12px;border-radius:9px;border:1px solid #334155;background:#0f141b;color:#fff}button{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800}@media(max-width:520px){.vehicle{width:100px;font-size:48px}.jfs-logo{width:64px;height:64px}.title{font-size:21px}}</style></head><body><main class="card"><div class="login-head"><img class="jfs-logo" src="jfs-ai-logo.svg" alt="JFS AI Technology"><div><h1 class="title">Rekap Muatan</h1><div class="sub">Login Owner Usaha · Gratis 1 bulan untuk pengguna baru.</div></div><div class="vehicle" aria-label="Kendaraan logistik">🚚</div></div><div class="powered">Powered by JFS AI Technology</div><form id="f"><input id="e" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required><button>Login / Daftar</button></form><p id="m"></p></main><script>const c=supabase.createClient('https://evtkeyfjgqwarsmlzrkh.supabase.co','sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'jfs-rekap-auth'}});document.getElementById('f').onsubmit=async function(ev){ev.preventDefault();const email=document.getElementById('e').value.trim().toLowerCase(),password=document.getElementById('p').value;const m=document.getElementById('m');m.textContent='Memproses...';try{let r=await c.auth.signInWithPassword({email,password});if(r.error){const s=await c.auth.signUp({email,password});if(s.error){m.textContent=s.error.message;return}if(!s.data?.session){m.textContent='Akun berhasil dibuat. Jika verifikasi email aktif, buka email Anda lalu login kembali.';return}}const s=await c.auth.getSession();if(!s.data.session){m.textContent='Login belum menghasilkan sesi. Silakan coba lagi.';return}location.href=new URLSearchParams(location.search).get('next')||'laporan-rekap-muatan/index.html'}catch(e){console.error(e);m.textContent='Koneksi login gagal: '+(e?.message||'silakan coba lagi')}}</script></body></html>
