nd({type:'signup',email,options:{emailRedirectTo:redirectUrl}});m.textContent=rr.error?(isRateLimit(rr.error)?'Email verifikasi baru saja dikirim. Tunggu sekitar 1 menit sebelum meminta ulang.':rr.error.message):'Akun sudah terdaftar tetapi email belum terverifikasi. Email verifikasi terbaru sudah dikirim. Gunakan link terbaru hanya sekali.';resend.style.display='block';return}const s=await c.auth.signUp({email,password,options:{emailRedirectTo:redirectUrl}});if(s.error){if(/already registered|already exists/i.test(s.error.message||'')){const rr=await c.auth.resend({type:'signup',email,options:{emailRedirectTo:redirectUrl}});m.textContent=rr.error?(isRateLimit(rr.error)?'Akun sudah ada. Tunggu sekitar 1 menit sebelum meminta email verifikasi lagi.':rr.error.message):'Akun sudah ada. Email verifikasi terbaru sudah dikirim.';resend.style.display='block';return}m.textContent=s.error.message;return}if(s.data?.session){location.replace(nextUrl);return}m.textContent='Akun berhasil dibuat. Buka email verifikasi terbaru, lalu klik link tersebut. Link hanya dapat digunakan sekali.';resend.style.display='block'}catch(e){console.error(e);m.textContent='Koneksi login gagal: '+(e?.message||'silakan coba lagi')}};resend.onclick=async()=>{const email=document.getElementById('e').value.trim().toLowerCase();if(!email)return;m.textContent='Mengirim ulang verifikasi...';const r=await c.auth.resend({type:'signup',email,options:{emailRedirectTo:redirectUrl}});m.textContent=r.error?(isRateLimit(r.error)?'Terlalu cepat. Tunggu sekitar 1 menit sebelum meminta ulang.':'Gagal mengirim ulang: '+r.error.message):'Verifikasi terbaru sudah dikirim. Gunakan email terbaru.'};</script></body></html>
