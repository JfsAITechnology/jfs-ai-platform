<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription — Rekap Muatan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d1117;color:#fff;font:15px Arial}.wrap{max-width:900px;margin:auto;padding:25px}.card{background:#151a22;border:1px solid #273142;border-radius:16px;padding:18px;margin:12px 0}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{padding:11px;border:0;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800}@media(max-width:700px){.plans{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>🚚 Rekap Muatan — Subscription</h1><p>Trial gratis 1 bulan. Setelah berakhir, aplikasi dikunci sampai subscription diaktifkan.</p><div id="status" class="card">Memuat...</div><div id="plans" class="plans"></div></main><script>const c=supabase.createClient('https://evtkeyfjgqwarsmlzrkh.supabase.co','sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'jfs-rekap-auth'}});const money=v=>Number(v||0).toLocaleString('id-ID');async function load(){const {data,error}=await c.rpc('jfs_get_my_app_subscription',{p_app_code:'REKAP-MUATAN'});if(error){status.textContent=error.message;return}const r=data?.[0];status.innerHTML='<b>Status: '+r.status+'</b><br>Paket: '+(r.plan_name||'-')+'<br>Sisa: '+(r.remaining_days??'-')+' hari';const q=await c.from('jfs_app_subscription_plans').select('*').eq('app_code','REKAP-MUATAN').eq('is_active',true).order('sort_order');plans.innerHTML=q.data.map(p=>'<div class="card"><b>'+p.name+'</b><h2>'+(p.price?'Rp '+money(p.price):p.is_trial?'Gratis':'Custom')+'</h2><p>'+(p.description||'')+'</p><button onclick="req(\''+p.id+'\')">'+(p.is_trial?'Trial Gratis':p.id.includes('CUSTOM')?'Hubungi Admin':'Pilih Paket')+'</button></div>').join('')}async function req(id){if(id.includes('TRIAL'))return alert('Trial otomatis aktif 30 hari untuk pengguna baru.');if(id.includes('CUSTOM'))return alert('Paket Custom: silakan hubungi Super Admin JFS AI untuk menentukan kebutuhan dan durasi.');const {error}=await c.rpc('jfs_request_app_subscription',{p_app_code:'REKAP-MUATAN',p_plan_id:id});if(error)return alert(error.message);alert('Permintaan tercatat. Admin JFS AI akan memproses aktivasi.');load()}load()</script></body></html>
