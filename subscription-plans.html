<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JFS AI — SaaS Pricing Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d1117;color:#f8fafc;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.card{background:#151a22;border:1px solid #273142;border-radius:16px;padding:18px;margin-bottom:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.tab{background:#202938;color:#fff}.tab.active{background:linear-gradient(135deg,#7c3aed,#2563eb)}input{background:#0f141b;border:1px solid #334155;color:#fff;border-radius:8px;padding:9px;width:150px}.row{display:grid;grid-template-columns:1fr 120px 170px 90px;gap:12px;align-items:center}.muted{color:#94a3b8;font-size:12px}.save{background:#159b61;color:#fff}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.row .full{grid-column:1/-1}input{width:100%;box-sizing:border-box}}</style></head><body><main class="wrap"><header class="top"><div><h1 style="margin:0">💳 SaaS Pricing Control</h1><div class="muted">Harga subscription dapat diubah dari satu tempat sebelum diterapkan ke aplikasi.</div></div><button onclick="location.href='index.html#license'">← Kembali Platform</button></header><div id="msg" class="muted">Memeriksa akses admin...</div><div id="app" hidden><div class="tabs"><button class="tab active" data-app="LAUNDRY">🧺 Laundry AI</button><button class="tab" data-app="REKAP-MUATAN">🚚 Rekap Muatan</button><button class="tab" data-app="KEUANGAN-PINTAR">💰 Keuangan Pintar</button></div><div id="list"></div></div></main><script>
const URL='https://evtkeyfjgqwarsmlzrkh.supabase.co',KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD',client=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let app='LAUNDRY',plans=[];
const $=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('id-ID');
async function boot(){const {data:{session}}=await client.auth.getSession();if(!session){$('msg').textContent='Silakan login Admin JFS AI dari Platform utama.';return}const {data:ok,error}=await client.rpc('jfs_is_platform_admin');if(error||ok!==true){$('msg').textContent='Akses ditolak: akun bukan Super Admin JFS AI.';return}$('msg').textContent='Admin terverifikasi.';$('app').hidden=false;await load()}
async function load(){const {data,error}=await client.from('jfs_app_subscription_plans').select('*').or('app_code.eq.ALL,app_code.eq.'+app).order('sort_order');if(error){$('list').textContent=error.message;return}plans=data;render()}
function render(){$('list').innerHTML=plans.filter(p=>p.app_code===app).map(p=>`<div class="card"><div class="row"><div><b>${p.name}</b><div class="muted">${p.description||''}</div><div class="muted">ID: ${p.id} • ${p.duration_days} hari ${p.is_trial?'• TRIAL':''}</div></div><div><span class="muted">Harga</span><input id="price-${p.id}" type="number" min="0" value="${p.price||0}"></div><div class="muted full">0 = harga belum ditetapkan / custom. Perubahan tersimpan ke katalog pusat JFS AI.</div><button class="save" onclick="savePlan('${p.id}')">Simpan</button></div></div>`).join('')||'<div class="card">Belum ada paket.</div>'}
async function savePlan(id){const price=Number(document.getElementById('price-'+id).value||0);try{const {error}=await client.rpc('jfs_admin_update_app_plan',{p_id:id,p_price:price});if(error)throw error;alert('Harga berhasil diperbarui.');await load()}catch(e){alert('Gagal: '+e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');app=b.dataset.app;load()});boot();
</script></body></html>
