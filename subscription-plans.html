<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFS AI — Subscription Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0d1117;color:#f8fafc;font:14px Arial}.wrap{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card{background:#151a22;border:1px solid #273142;border-radius:16px;padding:16px;margin:10px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.tab{background:#202938;color:#fff}.tab.active{background:linear-gradient(135deg,#7c3aed,#2563eb)}input,textarea{background:#0f141b;border:1px solid #334155;color:#fff;border-radius:8px;padding:9px;box-sizing:border-box;width:100%}textarea{min-height:55px;resize:vertical}.grid{display:grid;grid-template-columns:1.1fr 150px 1fr 95px;gap:10px;align-items:start}.muted{color:#94a3b8;font-size:12px}.save{background:#159b61;color:#fff}.danger{background:#7f1d1d;color:#fff}.active{color:#86efac}.inactive{color:#fca5a5}.req{display:flex;justify-content:space-between;gap:12px;align-items:center}.custom{border-color:#7c3aed}@media(max-width:750px){.grid{grid-template-columns:1fr}.req{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><h1 style="margin:0">💳 JFS AI Subscription Control</h1><div class="muted">Kontrol pusat paket, harga, status aktif, dan permintaan subscription.</div></div><button onclick="location.href='index.html#license'">← Kembali Platform</button></header>
<div id="msg" class="muted">Memeriksa akses admin...</div><section id="app" hidden><div class="tabs">
<button class="tab active" data-app="LAUNDRY">🧺 Laundry AI</button><button class="tab" data-app="REKAP-MUATAN">🚚 Rekap Muatan</button><button class="tab" data-app="KEUANGAN-PINTAR">💰 Keuangan Pintar</button>
</div><div id="list"></div><h2>📋 Permintaan Subscription</h2><div id="requests"></div></section></main>
<script>
const URL='https://evtkeyfjgqwarsmlzrkh.supabase.co',KEY='sb_publishable_7lGio_RVVgkVASYYyBHQIg_GvL-8ELD';
const client=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let app='LAUNDRY',plans=[];const $=x=>document.getElementById(x),money=v=>Number(v||0).toLocaleString('id-ID');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){try{$('msg').textContent='Memeriksa sesi login...';const {data:{session},error:se}=await client.auth.getSession();if(se)throw se;if(!session){$('msg').textContent='Silakan login sebagai Super Admin JFS AI dari Platform utama.';return}const {data:{user},error:ue}=await client.auth.getUser();if(ue)throw ue;if(!user){$('msg').textContent='Sesi login tidak valid.';return}$('msg').textContent='Memeriksa hak akses Super Admin...';const r=await Promise.race([client.rpc('jfs_is_platform_admin'),new Promise((_,x)=>setTimeout(()=>x(new Error('Timeout pemeriksaan admin')),10000))]);if(r.error)throw r.error;if(r.data!==true){$('msg').textContent='Akses ditolak: akun bukan Super Admin JFS AI.';return}$('msg').textContent='Super Admin terverifikasi.';$('app').hidden=false;await load()}catch(e){console.error(e);$('msg').textContent='Gagal memeriksa akses: '+(e.message||e)}} 
async function load(){const {data,error}=await client.from('jfs_app_subscription_plans').select('*').eq('app_code',app).order('sort_order');if(error){$('list').innerHTML='<div class="card">'+esc(error.message)+'</div>';return}plans=data||[];render();loadRequests()}
function render(){$('list').innerHTML=plans.map(p=>'<div class="card '+(p.id.includes('CUSTOM')?'custom':'')+'"><div class="grid"><div><b>'+esc(p.name)+'</b><div class="muted">ID: '+esc(p.id)+' • '+p.duration_days+' hari '+(p.is_trial?'• TRIAL':'')+'</div><label class="muted">Nama paket<input id="name-'+p.id+'" value="'+esc(p.name)+'"></label><label class="muted">Deskripsi<textarea id="desc-'+p.id+'">'+esc(p.description||'')+'</textarea></label></div><label class="muted">Harga (Rp)<input id="price-'+p.id+'" type="number" min="0" value="'+(p.price||0)+'"></label><div><label class="muted">Status</label><div style="margin:10px 0"><input id="active-'+p.id+'" type="checkbox" '+(p.is_active?'checked':'')+'> <span class="'+(p.is_active?'active':'inactive')+'">'+(p.is_active?'Aktif':'Nonaktif')+'</span></div><div class="muted">'+(p.is_trial?'Trial otomatis untuk pengguna baru.':p.id.includes('CUSTOM')?'By request; jangan diaktifkan langsung tanpa penetapan durasi.':'Paket standar berbayar; harga dikontrol dari sini.')+'</div></div><button class="save" onclick="savePlan(\''+p.id+'\')">Simpan</button></div></div>').join('')||'<div class="card">Belum ada paket untuk aplikasi ini.</div>'}
async function savePlan(id){const p=plans.find(x=>x.id===id);const price=Number($('price-'+id).value||0);const name=$('name-'+id).value.trim();const desc=$('desc-'+id).value;const active=$('active-'+id).checked;if(!name)return alert('Nama paket wajib diisi');try{const {error}=await client.rpc('jfs_admin_update_app_plan',{p_id:id,p_price:price,p_name:name,p_description:desc,p_is_active:active});if(error)throw error;alert('Paket tersimpan.');await load()}catch(e){alert('Gagal menyimpan: '+e.message)}}
async function loadRequests(){try{const {data,error}=await client.rpc('jfs_admin_list_app_subscriptions',{p_app_code:app});if(error)throw error;const rows=(data||[]).filter(x=>x.status==='pending').map(x=>{const custom=String(x.plan_id||'').includes('CUSTOM');return '<div class="card req"><div><b>'+esc(x.user_email)+'</b><div class="muted">'+esc(x.plan_name||x.plan_id)+' • Rp '+money(x.amount)+'</div></div>'+(custom?'<span class="muted">Custom — tentukan durasi sebelum aktivasi.</span>':'<button class="save" onclick="activate(\''+x.id+'\',\''+x.plan_id+'\')">Aktifkan</button>')+'</div>'}).join('');$('requests').innerHTML=rows||'<div class="card muted">Tidak ada permintaan pending.</div>'}catch(e){$('requests').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function activate(id,plan){if(String(plan).includes('CUSTOM'))return alert('Custom harus ditetapkan durasinya terlebih dahulu.');try{const {error}=await client.rpc('jfs_admin_activate_app_subscription',{p_subscription_id:id,p_plan_id:plan});if(error)throw error;alert('Subscription aktif.');await loadRequests()}catch(e){alert('Gagal aktivasi: '+e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');app=b.dataset.app;load()});boot();
</script></body></html>
